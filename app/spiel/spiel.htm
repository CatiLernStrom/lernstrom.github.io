<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>LernStrom — Elektriker-Baustellen-Adventure</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0c1119;color:#e8edf2;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 0%,#16222e 0%,#0c1119 70%)}
  /* Game-Einbettung */
  .game{position:absolute;inset:0;display:flex;flex-direction:column;background:#0c1119}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,#11202c,#0c1119);
    border-bottom:1px solid rgba(45,212,191,.18);z-index:5}
  .bar .t{flex:1;font-weight:800;font-size:14px;color:#cfe;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .x{width:34px;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.15);background:#1a232e;color:#e8edf2;font-size:15px;cursor:pointer}
  .nx{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#1a232e;color:#9fb0c0;font-weight:800;font-size:13px;cursor:pointer;transition:.2s}
  .nx.on{background:linear-gradient(180deg,#2dd4bf,#14b8a6);color:#06281f;border-color:#2dd4bf;box-shadow:0 0 16px rgba(45,212,191,.5);animation:pulse 1.1s infinite}
  iframe{flex:1;width:100%;border:0;background:#0c1119}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  /* Szenen */
  .scene{width:min(560px,92vw);padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  h1{font-size:26px;font-weight:900;color:#fff;margin:4px 0 0;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  h2{font-size:21px;font-weight:900;color:#fff;margin:0}
  .sub{font-size:14px;color:#9fb0c0;font-weight:600;line-height:1.5;max-width:440px}
  .sub.sm{font-size:12.5px;opacity:.85}
  .cta{margin-top:14px;padding:13px 28px;border:0;border-radius:14px;cursor:pointer;font-weight:900;font-size:15px;color:#06281f;
    background:linear-gradient(180deg,#2dd4bf,#14b8a6);box-shadow:0 6px 20px rgba(45,212,191,.35)}
  .cta.sm{padding:9px 18px;font-size:13px;margin-top:8px}
  .cta.ghost{background:#1a232e;color:#cfe;border:1px solid rgba(255,255,255,.16);box-shadow:none}
  .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  /* Travel */
  .travel{width:100%;max-width:none;height:100%;justify-content:flex-end;gap:0;padding:0;position:relative}
  .travel.morgen{background:linear-gradient(180deg,#f6b765 0%,#c97b53 45%,#2a3744 60%)}
  .travel.tag{background:linear-gradient(180deg,#7fc4e8 0%,#5a93b8 45%,#2a3744 60%)}
  .sky{position:absolute;top:18%;width:100%;text-align:center;font-size:30px}
  .scenery{display:inline-block;white-space:nowrap;animation:scroll 7s linear infinite;opacity:.85}
  @keyframes scroll{from{transform:translateX(18%)}to{transform:translateX(-18%)}}
  .road{position:absolute;bottom:18%;width:100%;height:120px;background:linear-gradient(180deg,#3a4654,#20282f);border-top:4px solid #11161c;overflow:hidden}
  .van{position:absolute;left:50%;top:18px;transform:translateX(-50%);font-size:64px;animation:bounce .5s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.4))}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
  .lines{position:absolute;bottom:26px;width:100%;height:8px;background:repeating-linear-gradient(90deg,#ffd166 0 38px,transparent 38px 78px);animation:ln .35s linear infinite}
  @keyframes ln{from{background-position:0 0}to{background-position:-78px 0}}
  .tlabel{position:absolute;bottom:9%;width:100%;text-align:center;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.7);z-index:3}
  .tlabel .dest{display:block;font-size:13px;color:#ffd166;font-weight:800;margin-top:4px}
  .travel .cta{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:4}
  /* Shop */
  .doors{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .door{width:130px;height:130px;border-radius:16px;cursor:pointer;background:linear-gradient(180deg,#1c2733,#141b24);
    border:1.5px solid rgba(255,255,255,.12);color:#e8edf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:800;font-size:14px;transition:.18s}
  .door:hover{transform:translateY(-3px);border-color:rgba(45,212,191,.4)}
  .door small{font-size:10.5px;color:#8493a3;font-weight:600}
  .door .ic{font-size:40px}
  .door.primary{border-color:#2dd4bf;box-shadow:0 0 20px rgba(45,212,191,.3)}
  .door.primary small{color:#7af0d9}
  /* Overlay */
  .vig{position:fixed;inset:0;z-index:10;background:rgba(6,9,13,.78);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
  .card{width:min(420px,90vw);background:linear-gradient(180deg,#16212c,#0e151d);border:1px solid rgba(45,212,191,.25);border-radius:18px;padding:24px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .card p{font-size:13.5px;color:#d6dee6;line-height:1.5;margin:8px 0}
  .card .cic{font-size:52px}
  .card .cic.wig{animation:wiggle .4s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .gag{font-weight:800;color:#ffd166!important}
  /* Day */
  .day{cursor:pointer}
  .dic{font-size:70px;animation:float 2.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .dhint{font-size:12px;color:#6b7c8c;margin-top:8px;opacity:0;transition:opacity .5s}
  .dhint.on{opacity:1}
  /* Finale */
  .confetti{font-size:40px;letter-spacing:8px;animation:float 2s ease-in-out infinite}
  .stamp{transform:rotate(-8deg);border:3px solid #2dd4bf;color:#2dd4bf;font-weight:900;padding:6px 16px;border-radius:10px;letter-spacing:1px;font-size:15px;box-shadow:0 0 18px rgba(45,212,191,.35)}
  .chef{background:#11202c;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 18px;font-size:14px;font-weight:700;color:#cfe;max-width:440px}
  /* Stepper */
  #stepper{position:fixed;bottom:8px;left:8px;z-index:4100;display:flex;align-items:center;gap:4px;background:rgba(10,14,20,.7);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:4px 6px}
  #stepper button{width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,255,255,.12);background:#1a232e;color:#9fb0c0;font-size:13px;cursor:pointer}
  #stepper button:disabled{opacity:.35}
  #stepper span{font-size:11px;color:#9fb0c0;font-weight:700;padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="stepper"></div>
<script>
/* ===== Roter Faden ===== */
const STORY = [
  {type:'scene',scene:'intro'},
  {type:'scene',scene:'travel',label:'Fahrt ins Geschäft',to:'shop',time:'morgen'},
  {type:'scene',scene:'shophub'},
  {type:'game',file:'buero-intro.htm',title:'Büro: Auftrag & Material'},
  {type:'scene',scene:'travel',label:'Fahrt zur Baustelle',to:'site',time:'tag'},
  {type:'game',file:'baustromverteiler-v2.htm',title:'Bauprovisorium anschliessen'},
  {type:'scene',scene:'day',title:'Nächster Tag',sub:'Die Erdarbeiten sind bereit.',icon:'🌅'},
  {type:'game',file:'fundamenterdung.htm',title:'Fundamenterdung verlegen'},
  {type:'game',file:'decke-einlegen.htm',title:'Decke aufnageln & einlegen'},
  {type:'scene',scene:'day',title:'Beton trocknet…',sub:'Ein paar Tage später — ausgeschalt.',icon:'🧱'},
  {type:'game',file:'dosen-anzeichnen.htm',title:'Ausschalen & Dosen anzeichnen'},
  {type:'game',file:'schlitzen.htm',title:'Schlitzen & Rohre setzen'},
  {type:'scene',scene:'day',title:'Znünipause ☕',sub:'Kurz durchschnaufen — dann Drähte ziehen.',icon:'☕'},
  {type:'game',file:'kabel-einziehen.htm',title:'Kabel & Drähte einziehen'},
  {type:'game',file:'abzweigdose-verdrahten.htm',title:'Abzweigdosen verdrahten'},
  {type:'game',file:'hauptverteilung.htm',title:'Hauptverteilung bauen'},
  {type:'scene',scene:'day',title:'Der Maler war da',sub:'Wände gestrichen — jetzt die Apparate.',icon:'🎨'},
  {type:'game',file:'apparate-setzen.htm',title:'Apparate setzen'},
  {type:'game',file:'kontrolle.htm',title:'Kontrolle & Abnahme'},
  {type:'scene',scene:'day',title:'Die Erstprüfung',sub:'Jetzt zählt jede Messung — NIN 2025.',icon:'🧪'},
  {type:'game',file:'erstpruefung.htm',title:'Erstprüfung (NIV-Messungen)'},
  {type:'scene',scene:'finale'},
];
const KEY='lernstrom_baustelle_progress';
let idx=(()=>{try{return Math.max(0,Math.min(JSON.parse(localStorage.getItem(KEY)||'{}').idx||0,STORY.length-1))}catch(e){return 0}})();
const app=document.getElementById('app');
function save(){try{localStorage.setItem(KEY,JSON.stringify({idx,ts:Date.now()}))}catch(e){}}
let fired=false;
function go(i){idx=Math.max(0,Math.min(i,STORY.length-1));save();render()}
function next(){if(fired)return;fired=true;go(idx+1)}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}

function render(){
  fired=false; app.innerHTML='';
  const n=STORY[idx];
  if(n.type==='game') renderGame(n); else renderScene(n);
  const st=document.getElementById('stepper');
  st.innerHTML='';
  const home=el('button',null,'⌂'); home.onclick=()=>go(0);
  const prev=el('button',null,'‹'); prev.disabled=idx===0; prev.onclick=()=>go(idx-1);
  const lbl=el('span',null,(idx+1)+'/'+STORY.length);
  const nx=el('button',null,'›'); nx.disabled=idx===STORY.length-1; nx.onclick=()=>go(idx+1);
  st.append(home,prev,lbl,nx);
}

/* ===== Game ===== */
function renderGame(n){
  const wrap=el('div','game');
  const bar=el('div','bar');
  const x=el('button','x','✕'); x.onclick=()=>go(0);
  const t=el('div','t',n.title);
  const nb=el('button','nx','Überspringen ›'); nb.onclick=next;
  bar.append(x,t,nb);
  const fr=document.createElement('iframe'); fr.src=n.file; fr.title=n.title;
  wrap.append(bar,fr); app.append(wrap);
  let won=false;
  const iv=setInterval(()=>{
    try{const w=fr.contentDocument&&fr.contentDocument.getElementById('win');
      if(w&&w.classList.contains('show')&&!won){won=true;nb.textContent='Weiter →';nb.classList.add('on');
        setTimeout(()=>{clearInterval(iv);next();},2800);}
    }catch(e){}
  },500);
  // Aufräumen wenn Node wechselt
  const obs=new MutationObserver(()=>{if(!document.body.contains(wrap)){clearInterval(iv);obs.disconnect();}});
  obs.observe(app,{childList:true});
}

/* ===== Szenen ===== */
function renderScene(n){
  if(n.scene==='intro') return sceneIntro();
  if(n.scene==='travel') return sceneTravel(n);
  if(n.scene==='shophub') return sceneShop();
  if(n.scene==='day') return sceneDay(n);
  if(n.scene==='finale') return sceneFinale();
}
function sceneIntro(){
  const s=el('div','scene');
  s.innerHTML=`<div style="filter:drop-shadow(0 10px 24px rgba(0,0,0,.5))">
    <svg viewBox="0 0 220 170" width="220" height="170">
      <rect x="20" y="70" width="180" height="90" rx="4" fill="#1c2733" stroke="#0e151d" stroke-width="3"/>
      <path d="M10 72 L110 18 L210 72 Z" fill="#26404f" stroke="#0e151d" stroke-width="3"/>
      <rect x="50" y="95" width="34" height="34" rx="3" fill="#ffd166" opacity=".85"/>
      <rect x="136" y="95" width="34" height="34" rx="3" fill="#ffd166" opacity=".55"/>
      <rect x="96" y="118" width="28" height="42" rx="2" fill="#0e151d"/>
    </svg></div>
    <h1>Dein erster grosser Auftrag</h1>
    <p class="sub">Einfamilienhaus Müller — komplette Elektroinstallation.<br>Du bist der Lehrling. Von A bis Z. Los geht's!</p>`;
  const b=el('button','cta','Tag 1 starten →'); b.onclick=next; s.append(b); app.append(s);
}
function sceneTravel(n){
  const s=el('div','scene travel '+(n.time==='morgen'?'morgen':'tag'));
  const dest=n.to==='site'?'🏗️ Baustelle':'🏢 Geschäft';
  const scenery=n.to==='site'?'🏔️ &nbsp; 🌲 &nbsp; 🏠 &nbsp; 🌲 &nbsp; 🏗️':'🌳 &nbsp; 🏘️ &nbsp; 🚦 &nbsp; 🏢 &nbsp; 🌳';
  s.innerHTML=`<div class="sky"><div class="scenery">${scenery}</div></div>
    <div class="road"><div class="van">🚐</div><div class="lines"></div></div>
    <div class="tlabel">${n.label}<span class="dest">→ ${dest}</span></div>`;
  const b=el('button','cta','Überspringen ›'); b.onclick=next; s.append(b); app.append(s);
  setTimeout(()=>{b.textContent='Angekommen →'},3600);
}
function sceneShop(){
  const s=el('div','scene');
  s.innerHTML=`<h2>🏢 Im Geschäft</h2><p class="sub">Wohin zuerst? Der Auftrag wartet im <b>Büro</b>.</p>`;
  const doors=el('div','doors');
  const mag=el('button','door','<span class="ic">📦</span><span>Magazin</span>');
  const buro=el('button','door primary','<span class="ic">📋</span><span>Büro</span><small>Auftrag annehmen →</small>');
  const wc=el('button','door gag','<span class="ic">🚽</span><span>WC</span><small>…kurz verschwinden?</small>');
  buro.onclick=next;
  mag.onclick=()=>showVig('📦','Hochregallager voll mit Material. Aber die Liste machst du erst im Büro — komm später zum Beladen zurück.',false);
  wc.onclick=()=>showVig('🚽','<span class="gag">«Pssst! Der Chef sucht jemanden für die Drecksarbeit… schnell aufs WC und verstecken!» 🤫</span><br><br><span class="sub sm">…erwischt. 😅 Der Chef grinst: «Schöner Versuch — ab ins Büro!»</span>',true);
  doors.append(mag,buro,wc); s.append(doors); app.append(s);
}
function showVig(ic,html,gag){
  const v=el('div','vig');
  const c=el('div','card',`<div class="cic ${gag?'wig':''}">${ic}</div><p>${html}</p>`);
  const b=el('button','cta sm',gag?'Ertappt — ins Büro →':'Zurück');
  b.onclick=(e)=>{e.stopPropagation();v.remove();if(gag)next();};
  c.append(b); v.append(c); v.onclick=()=>v.remove(); app.append(v);
}
function sceneDay(n){
  const s=el('div','scene day');
  s.innerHTML=`<div class="dic">${n.icon||'🌅'}</div><h2>${n.title||'Nächster Tag'}</h2>${n.sub?`<p class="sub">${n.sub}</p>`:''}<div class="dhint">tippen zum Weitermachen</div>`;
  s.onclick=next; app.append(s);
  setTimeout(()=>{const h=s.querySelector('.dhint');if(h)h.classList.add('on')},1500);
  setTimeout(next,3200);
}
function sceneFinale(){
  const s=el('div','scene');
  s.innerHTML=`<div class="confetti">🎉 ⚡ 🎉</div><div class="stamp">SiNa ✓ NIN 2025</div>
    <h1>Abnahme bestanden!</h1>
    <p class="sub">Vom Bauprovisorium bis zum Sicherheitsnachweis — du hast das ganze EFH Müller verkabelt, geprüft und abgenommen.</p>
    <div class="chef">👷‍♂️ «Saubere Arbeit, Lehrling. Aufs nächste Haus!»</div>`;
  const row=el('div','row');
  const a=el('button','cta','Nochmal von vorne'); a.onclick=()=>go(0);
  const b=el('button','cta ghost','Beenden'); b.onclick=()=>go(0);
  row.append(a,b); s.append(row); app.append(s);
}
render();
</script>
</body>
</html>
