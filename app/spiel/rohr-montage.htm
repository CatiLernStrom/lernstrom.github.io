<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LernStrom — Rohr-Montage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 30%, #1a2230 0%, #0c1018 70%, #06080d 100%);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8edf2;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:390px;height:844px;
    max-height:100vh;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 10px #0a0d13, 0 0 0 12px #1c232e, inset 0 0 60px rgba(0,0,0,.4);
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(45,212,191,.10), transparent 60%),
      linear-gradient(180deg,#26303d 0%, #1a212c 35%, #141a23 100%);
  }
  @media (max-height:860px){ #stage{transform:scale(calc(100vh / 860));} }

  #stage::after{
    content:"";position:absolute;inset:0;border-radius:34px;pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.55), inset 0 -40px 80px rgba(0,0,0,.5);
    background:radial-gradient(140% 90% at 50% 120%, rgba(120,80,30,.18), transparent 55%);
    z-index:60;
  }

  canvas#fx{position:absolute;inset:0;z-index:40;pointer-events:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:50;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;}
  .badge{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .badge .dot{width:9px;height:9px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf;}
  #xpBadge{color:#ffd166;}
  #xpBadge .ico{filter:drop-shadow(0 0 5px rgba(255,209,102,.6));}
  .spacer{flex:1;}
  #mute{
    width:38px;height:38px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  #mute:active{transform:scale(.92);}

  /* step progress bar */
  #prog{position:absolute;top:58px;left:16px;right:16px;z-index:50;height:8px;border-radius:6px;
    background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  #progFill{height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#2dd4bf,#7af0d9);transition:width .5s cubic-bezier(.2,1.3,.4,1);
    box-shadow:0 0 12px rgba(45,212,191,.7);}

  /* ---------- title / instruction ---------- */
  #task{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:50;text-align:center;
    pointer-events:auto;max-width:330px;padding:7px 14px;border-radius:14px;
    background:linear-gradient(180deg,rgba(26,33,44,.82),rgba(18,24,32,.82));
    border:1px solid rgba(255,255,255,.06);box-shadow:0 6px 16px rgba(0,0,0,.4);
    transition:opacity .45s, transform .45s;cursor:pointer;}
  #task.faded{opacity:.12;}
  #task.faded:hover{opacity:1;}
  #task.hidden{opacity:0;transform:translateX(-50%) translateY(-10px);pointer-events:none;}
  #taskToggle{width:auto;height:38px;padding:0 11px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#202a37,#161d27);border:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#9fb0c0;
    box-shadow:0 4px 10px rgba(0,0,0,.4);gap:5px;}
  #taskToggle.off{color:#5a6675;}
  #taskToggle:active{transform:scale(.92);}
  #task h1{font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #task p{font-size:12px;margin-top:3px;color:#9fb0c0;font-weight:600;line-height:1.4;}

  /* step chips row */
  #steps{position:absolute;top:38px;left:16px;right:16px;z-index:49;display:flex;gap:3px;justify-content:center;pointer-events:none;}
  #steps .sc{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);transition:background .4s, box-shadow .4s;}
  #steps .sc.done{background:linear-gradient(90deg,#2dd4bf,#7af0d9);box-shadow:0 0 8px rgba(45,212,191,.6);}
  #steps .sc.cur{background:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.7);}

  /* generic scene container */
  .prep{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .55s;}
  .prep.on{opacity:1;pointer-events:auto;}
  .prep svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* readout chip */
  .readout{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:35;
    font-size:13px;font-weight:800;color:#fff;background:linear-gradient(180deg,#202a37,#141a23);
    padding:7px 16px;border-radius:20px;border:1px solid rgba(45,212,191,.3);
    box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;text-align:center;min-width:200px;max-width:340px;}
  .readout .big{color:#7af0d9;font-size:16px;}
  .readout.bad{border-color:#ff6b6b;color:#ffb3b3;}
  .readout.good{border-color:#2dd4bf;}

  /* choice cards (kept from engine for visual parity) */
  .cards{position:absolute;left:50%;transform:translateX(-50%);z-index:36;
    display:grid;grid-template-columns:1fr 1fr;gap:8px;width:244px;}
  .card-pick{
    background:linear-gradient(180deg,#222d3a,#161d27);
    border:1.5px solid rgba(255,255,255,.08);border-radius:13px;
    padding:9px 8px;cursor:pointer;text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .15s, border-color .2s, box-shadow .2s;}
  .card-pick:active{transform:scale(.95);}
  .card-pick.bad{border-color:#ff6b6b;animation:cardShake .35s;}
  .card-pick.good{border-color:#2dd4bf;box-shadow:0 0 24px rgba(45,212,191,.5);}
  .card-pick.locked{opacity:.45;pointer-events:none;}
  .card-pick .ct{font-size:16px;font-weight:900;color:#fff;letter-spacing:.5px;}
  .card-pick .cs{font-size:9.5px;font-weight:700;color:#9fb0c0;margin-top:3px;line-height:1.35;}
  @keyframes cardShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* WIN overlay */
  #win{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(45,212,191,.18), rgba(6,9,14,.86) 60%);
    backdrop-filter:blur(2px);}
  #win.show{display:flex;animation:winIn .5s;}
  @keyframes winIn{from{opacity:0}to{opacity:1}}
  #win .card{
    width:308px;padding:26px 22px 24px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,#222d3a,#161d27);
    border:1px solid rgba(45,212,191,.3);
    box-shadow:0 30px 70px rgba(0,0,0,.7), 0 0 40px rgba(45,212,191,.2), inset 0 1px 0 rgba(255,255,255,.06);
    transform:scale(.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes pop{to{transform:scale(1)}}
  #win h2{font-size:21px;font-weight:900;color:#fff;letter-spacing:.5px;}
  #win .sub{font-size:13px;color:#9fb0c0;margin-top:5px;font-weight:600;}
  #stars{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;}
  #stars .st{font-size:34px;color:#2a3340;transform:scale(0);}
  #stars .st.lit{color:#ffd166;text-shadow:0 0 16px rgba(255,209,102,.8);animation:starPop .5s cubic-bezier(.2,1.8,.4,1) forwards;}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  #xpBig{font-size:30px;font-weight:900;color:#ffd166;margin:8px 0 4px;text-shadow:0 0 18px rgba(255,209,102,.5);}
  #win .stamp{display:inline-block;margin:6px 0 2px;padding:6px 16px;border-radius:10px;
    font-size:15px;font-weight:900;letter-spacing:1px;color:#7af0d9;
    border:2.5px solid #2dd4bf;transform:rotate(-7deg);
    box-shadow:0 0 18px rgba(45,212,191,.35);text-shadow:0 0 10px rgba(45,212,191,.5);}
  #win .ok{margin-top:16px;padding:12px 0;border-radius:14px;cursor:pointer;font-weight:800;font-size:15px;color:#06281f;
    background:linear-gradient(180deg,#5cf0d6,#2dd4bf);box-shadow:0 8px 20px rgba(45,212,191,.4);}
  #win .ok:active{transform:scale(.96);}

  .toast{position:absolute;z-index:55;font-weight:900;font-size:15px;pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:toastUp 1s ease-out forwards;}
  @keyframes toastUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

  .shake{animation:shakeStage .35s;}
  @keyframes shakeStage{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}

  /* affordance helpers */
  .pulseTool{animation:toolPulse 1.1s ease-in-out infinite;}
  @keyframes toolPulse{0%,100%{filter:drop-shadow(0 0 1px rgba(45,212,191,.3))}50%{filter:drop-shadow(0 0 10px rgba(45,212,191,.95)) drop-shadow(0 0 4px rgba(122,240,217,.9))}}
  .dragPath{stroke-dasharray:7 7;animation:dashMove 1s linear infinite;}
  @keyframes dashMove{to{stroke-dashoffset:-28;}}
  .ghost{pointer-events:none;}
  .pathArrow{animation:arrowGlow 1.1s ease-in-out infinite;}
  @keyframes arrowGlow{0%,100%{opacity:.55}50%{opacity:1}}
  .zonePulse{animation:zoneP 1.3s ease-in-out infinite;}
  @keyframes zoneP{0%,100%{opacity:.35}50%{opacity:.85}}

  /* floating "do this" hint banner — kompakte Leiste in der FREIEN Zone
     zwischen Auftrags-Schild (oben, ~152-194) und Rohr/Inhalt (ab ~262). */
  .doHint{position:absolute;left:50%;top:205px;transform:translateX(-50%);z-index:36;max-width:300px;
    font-size:10.5px;font-weight:800;color:#fff;text-align:center;line-height:1.3;
    background:linear-gradient(180deg,rgba(32,42,55,.95),rgba(20,26,35,.95));
    padding:6px 12px;border-radius:13px;border:1px solid rgba(45,212,191,.4);
    box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 22px rgba(45,212,191,.18);
    pointer-events:none;opacity:0;transition:opacity .4s;}
  .doHint.on{opacity:1;}
  .doHint b{color:#7af0d9;}

  #credit{position:absolute;left:0;right:0;bottom:5px;z-index:58;text-align:center;
    font-size:8.5px;font-weight:600;color:rgba(159,176,192,.5);letter-spacing:.2px;
    pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
</style>
</head>
<body>
<div id="stage">

  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="badge"><span class="dot"></span><span id="phaseLbl">Schritt 1</span></div>
    <div class="spacer"></div>
    <div class="badge" id="xpBadge"><span class="ico">&#9889;</span><span id="xpVal">0</span> XP</div>
    <div id="taskToggle" title="Aufgabe ein/aus">Aufgabe</div>
    <div id="mute">&#128263;</div>
  </div>

  <div id="steps"></div>
  <div id="prog"><div id="progFill"></div></div>

  <div id="task">
    <h1 id="taskTitle">Rohr-Montage</h1>
    <p id="taskSub">Rohr fachgerecht an die Wand montieren</p>
  </div>

  <!-- SCENES (eine pro Schritt) -->
  <div class="prep" id="pLaser"><svg id="svgLaser" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintLaser"></div><div class="readout" id="roLaser"></div></div>
  <div class="prep" id="pBriden"><svg id="svgBriden" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintBriden"></div><div class="readout" id="roBriden"></div></div>
  <div class="prep" id="pEndmuffen"><svg id="svgEndmuffen" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintEndmuffen"></div><div class="readout" id="roEndmuffen"></div></div>
  <div class="prep" id="pEntgraten"><svg id="svgEntgraten" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintEntgraten"></div><div class="readout" id="roEntgraten"></div></div>
  <div class="prep" id="pBohren"><svg id="svgBohren" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintBohren"></div><div class="readout" id="roBohren"></div></div>
  <div class="prep" id="pSchrauben"><svg id="svgSchrauben" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintSchrauben"></div><div class="readout" id="roSchrauben"></div></div>
  <div class="prep" id="pRohr"><svg id="svgRohr" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintRohr"></div><div class="readout" id="roRohr"></div></div>
  <div class="prep" id="pKabel"><svg id="svgKabel" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintKabel"></div><div class="readout" id="roKabel"></div></div>
  <div class="prep" id="pDose"><svg id="svgDose" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintDose"></div><div class="readout" id="roDose"></div></div>

  <div id="credit">LernStrom — Rohr-Montage</div>

  <!-- WIN -->
  <div id="win">
    <div class="card">
      <h2 id="winH2">ROHR MONTIERT</h2>
      <div class="sub" id="winType">Rohr korrekt montiert</div>
      <div id="stars"><span class="st">&#9733;</span><span class="st">&#9733;</span><span class="st">&#9733;</span></div>
      <div id="xpBig">+0 XP</div>
      <div class="stamp">MONTAGE i.O.</div>
      <div class="sub" id="winNote"></div>
      <div class="ok" id="again">Nochmal spielen</div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";
/* =============================================================
 *  LernStrom — Rohr-Montage (single-file)
 *  Frontale Wand-Ansicht. Vertikales Rohr (KIR grau / ALU
 *  metallic) an die Wand montieren: ausrichten, Briden setzen,
 *  (ALU) Endmuffen, entgraten, bohren, schrauben, Rohr einsetzen,
 *  Kabel einziehen, Dose anschliessen.
 *  Engine/Optik 1:1 wie steckdose-anschliessen.htm.
 * ============================================================= */

const STAGE_W = 390, STAGE_H = 844;
const SVGNS   = "http://www.w3.org/2000/svg";
const stage   = document.getElementById('stage');
const fx      = document.getElementById('fx');
const ctx     = fx.getContext('2d');

/* CH Adernfarben */
const COL = { L:'#8a5a2b', L1:'#8a5a2b', L2:'#222222', L3:'#8b95a1', N:'#1f6fd6', PE:'#1f9d55', PEY:'#ffd23a' };

/* ---------- Rohr/Wand-Geometrie ---------- */
const PIPE_X   = 195;
const PIPE_TOP = 262;
const PIPE_BOT = 648;
let BRIDEN_Y = [330, 440, 550];   // wird in newRun je Variante neu gesetzt (1/4, 1/2, 3/4)
function pipeW(){ return RUN.variant==='alu' ? 30 : 26; }

function toSvgFor(svg, clientX, clientY){
  const r = svg.getBoundingClientRect();
  return { x:(clientX-r.left)/r.width*STAGE_W, y:(clientY-r.top)/r.height*STAGE_H };
}

/* =============================================================
 *  AUDIO
 * ============================================================= */
let audioCtx=null, muted=true;
function AC(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return audioCtx; }
function tone(freq, dur, type, vol, slideTo){
  if(muted) return; const c=AC(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(vol||0.2, c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime+dur+0.02);
}
function sndClick(){ tone(680,0.07,'triangle',0.25,1200); setTimeout(()=>tone(1500,0.05,'sine',0.12),20); }
function sndSnap(){ tone(440,0.05,'square',0.18,900); setTimeout(()=>tone(1320,0.12,'triangle',0.22),30); }
function sndBuzz(){ if(muted)return; const c=AC(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sawtooth';o.frequency.value=120;
  g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.22,c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.25);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.27);
}
function sndPick(){ tone(520,0.05,'sine',0.14,720); }
function sndScrew(){ if(muted)return; const c=AC(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='triangle';o.frequency.value=200;
  o.frequency.exponentialRampToValueAtTime(420,c.currentTime+0.4);
  g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.10,c.currentTime+0.05);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.45);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.47);
}
function sndDrill(){ if(muted)return; const c=AC(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sawtooth';o.frequency.value=320;
  o.frequency.exponentialRampToValueAtTime(540,c.currentTime+0.3);
  g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.14,c.currentTime+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.42);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.44);
}
function sndWin(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*110)); }

document.getElementById('mute').onclick=function(){
  muted=!muted; this.innerHTML=muted?'&#128263;':'&#128266;';
  if(!muted){ AC(); tone(880,0.06,'sine',0.15); }
};

/* Aufgaben-Box Toggle */
window.__taskHidden=false;
(function(){
  const tk=document.getElementById('task');
  const tg=document.getElementById('taskToggle');
  if(tg && tk){
    tg.onclick=function(){
      window.__taskHidden=!window.__taskHidden;
      tg.classList.toggle('off',window.__taskHidden);
      clearTimeout(window.__taskFadeT);
      if(window.__taskHidden){ tk.classList.add('hidden'); }
      else{
        tk.classList.remove('hidden'); tk.classList.remove('faded');
        window.__taskFadeT=setTimeout(()=>{ if(!window.__taskHidden) tk.classList.add('faded'); },2200);
      }
    };
    tk.addEventListener('click',function(){
      if(window.__taskHidden) return;
      tk.classList.remove('faded');
      clearTimeout(window.__taskFadeT);
      window.__taskFadeT=setTimeout(()=>{ if(!window.__taskHidden) tk.classList.add('faded'); },2200);
    });
  }
})();

/* =============================================================
 *  PARTICLE / FX ENGINE
 * ============================================================= */
function sizeCanvas(){
  const r=stage.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  fx.width=STAGE_W*dpr; fx.height=STAGE_H*dpr;
  fx.style.width=r.width+'px'; fx.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
let particles=[];
function spark(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(opt.speed||3)*(0.4+Math.random());
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
      life:1, decay:0.012+Math.random()*0.02,
      size:(opt.size||2.4)*(0.6+Math.random()),
      color:opt.color|| (Math.random()<.5?'#ffd166':'#ffae42'),
      grav:opt.grav!=null?opt.grav:0.06, glow:opt.glow!==false
    });
  }
}
let confetti=[];
function burstConfetti(){
  const cols=['#2dd4bf','#ffd166','#ff6b6b','#7af0d9','#ffffff','#ffae42','#8ab4ff'];
  for(let i=0;i<150;i++){
    confetti.push({
      x:STAGE_W/2+(Math.random()-.5)*60, y:STAGE_H*0.42,
      vx:(Math.random()-.5)*9, vy:-Math.random()*11-3,
      g:0.22+Math.random()*0.1, w:5+Math.random()*6, h:8+Math.random()*8,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*0.4,
      color:cols[(Math.random()*cols.length)|0], life:1
    });
  }
}
function fxLoop(){
  ctx.clearRect(0,0,STAGE_W,STAGE_H);
  for(const d of dust){
    d.ph+=0.02; d.y+=d.vy; d.x+=d.vx+Math.sin(d.ph)*0.15;
    if(d.y<-4){d.y=STAGE_H+4;d.x=Math.random()*STAGE_W;}
    ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(d.ph));
    ctx.fillStyle='#ffe9c0';ctx.shadowBlur=4;ctx.shadowColor='#ffd9a0';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=p.grav; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.glow){ctx.shadowBlur=10;ctx.shadowColor=p.color;}else ctx.shadowBlur=0;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+0.4,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];
    c.vy+=c.g;c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;c.vx*=0.99;
    if(c.y>STAGE_H+30){confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    ctx.globalAlpha=1;ctx.fillStyle=c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(fxLoop);
}

const _seenSteps = {};
function firstVisit(step){ if(_seenSteps[step]) return false; _seenSteps[step]=true; return true; }
function ghostDemo(svg,x1,y1,x2,y2,opt){
  opt=opt||{};
  const reps=opt.reps||1, dur=opt.dur||1100, hold=opt.hold||260;
  const hand=el('g',{class:'ghost'});
  hand.appendChild(el('circle',{cx:0,cy:0,r:17,fill:'rgba(255,255,255,.14)',stroke:'#fff','stroke-width':1.4,opacity:0.7}));
  hand.appendChild(el('path',{d:'M -3 -2 q 0 -12 4 -12 q 4 0 4 12 l 0 6 q 6 -1 8 3 q 3 5 -1 12 q -4 6 -12 5 q -7 -1 -9 -8 l -2 -9 q 0 -4 4 -3 l 5 1 Z',
    fill:'#f4f7fa',stroke:'#10151c','stroke-width':1,transform:'translate(2,4) scale(.9)'}));
  svg.appendChild(hand);
  let rep=0;
  function run(){
    const t0=performance.now();
    (function a(t){
      let k=Math.min(1,(t-t0)/dur);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const hx=x1+(x2-x1)*e, hy=y1+(y2-y1)*e;
      hand.setAttribute('transform','translate('+hx+','+hy+')');
      hand.setAttribute('opacity', k<0.12?(k/0.12):(k>0.92?(1-(k-0.92)/0.08):1));
      if(k<1){ requestAnimationFrame(a); }
      else { rep++; if(rep<reps){ setTimeout(run,hold); } else { hand.remove(); if(opt.done) opt.done(); } }
    })(performance.now());
  }
  run();
  return hand;
}

/* generic pointer-drag helper. Returns a cleanup function. */
function dragTarget(svg, handle, onMove, onUp, onDown){
  let active=false;
  function down(e){ e.preventDefault(); AC(); active=true; try{handle.setPointerCapture(e.pointerId);}catch(_){} if(onDown) onDown(); }
  function move(e){ if(!active)return; onMove(toSvgFor(svg,e.clientX,e.clientY),e); }
  function up(e){ if(!active)return; active=false; onUp(toSvgFor(svg,e.clientX,e.clientY),e); }
  handle.addEventListener('pointerdown',down);
  svg.addEventListener('pointermove',move);
  window.addEventListener('pointerup',up);
  return ()=>{ handle.removeEventListener('pointerdown',down); svg.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
}

function addXp(n){
  n=Math.round((Number(n)||0)*0.5);
  const start=xp,end=xp+n,t0=performance.now();
  (function anim(t){
    const k=Math.min(1,(t-t0)/600);
    xp=Math.round(start+(end-start)*(1-Math.pow(1-k,3)));
    xpVal.textContent=xp;
    if(k<1)requestAnimationFrame(anim);
  })(performance.now());
}

  const knob=el('g',{cursor:'grab',class:'pulseTool'});
  knob.appendChild(el('circle',{cx:0,cy:0,r:15,fill:'rgba(255,80,80,.18)',stroke:'#ff6b6b','stroke-width':2}));
  knob.appendChild(el('circle',{cx:0,cy:0,r:5,fill:'#ff5b5b'}));
  svgLaser.appendChild(knob);

  // Libelle (Wasserwaage) horizontal
  const lx=110, lw=170, ly=276;
  svgLaser.appendChild(el('rect',{x:lx,y:ly-11,width:lw,height:22,rx:11,fill:'#0e1620',stroke:'#2dd4bf','stroke-width':1.4,opacity:0.95}));
  svgLaser.appendChild(el('line',{x1:lx+lw/2-13,y1:ly-9,x2:lx+lw/2-13,y2:ly+9,stroke:'#7af0d9','stroke-width':1.4}));
  svgLaser.appendChild(el('line',{x1:lx+lw/2+13,y1:ly-9,x2:lx+lw/2+13,y2:ly+9,stroke:'#7af0d9','stroke-width':1.4}));
  const bubble=el('circle',{cx:lx+lw/2,cy:ly,r:7,fill:'#9bf7c4',opacity:0.9});
  svgLaser.appendChild(bubble);

  function render(){
    const rad=deg*Math.PI/180;
    const tx=pivot.x+Math.sin(rad)*L, ty=pivot.y-Math.cos(rad)*L;
    beam.setAttribute('x2',tx); beam.setAttribute('y2',ty);
    knob.setAttribute('transform','translate('+tx+','+ty+')');
    const good=Math.abs(deg)<=2.5;
    beam.setAttribute('stroke', good?'#3bff8f':'#ff3b3b');
    // bubble offset
    const bx=lx+lw/2 + Math.max(-1,Math.min(1,deg/20))*(lw/2-16);
    bubble.setAttribute('cx',bx);
    bubble.setAttribute('fill', good?'#3bff8f':'#9bf7c4');
    if(!locked){
      roLaser.classList.toggle('good',good);
      roLaser.innerHTML='Neigung: <span class="big">'+deg.toFixed(1)+'&deg;</span> '+(good?'— lotrecht!':'— senkrecht stellen');
    }
  }
  render();

  function setFromPointer(p){
    const dx=p.x-pivot.x, dy=pivot.y-p.y;
    let d=Math.atan2(dx,Math.max(20,dy))*180/Math.PI;
    deg=Math.max(-40,Math.min(40,d));
    render();
    if(Math.abs(deg)<=2.5 && !locked) success();
  }
  function success(){
    locked=true; deg=0; render();
    knob.classList.remove('pulseTool');
    sndSnap(); spark(pivot.x,pivot.y-L,18,{color:'#3bff8f',speed:3,up:1});
    roLaser.classList.add('good'); roLaser.textContent='Lotrecht ausgerichtet — perfekt';
    addXp(10);
    setTimeout(()=>nextStep(),850);
  }
  cleanups.push(dragTarget(svgLaser,knob,(p)=>{ if(!locked) setFromPointer(p); },()=>{}, ()=>{ knob.classList.remove('pulseTool'); }));
  // tap on beam area also nudges toward vertical
  cleanups.push(dragTarget(svgLaser,svgLaser,(p)=>{ if(!locked) setFromPointer(p); },()=>{}));

  if(firstVisit('laser')){
    showDoHint('hintLaser','Zieh den <b>roten Punkt</b> oben, bis die Linie <b>senkrecht</b> ist (Libelle mittig).',6000);
  } else hideDoHint('hintLaser');
}

/* =============================================================
 *  STEP — ENTGRATEN (close-up: drag tool over cut end -> burr gone)
 * ============================================================= */
const svgEg=document.getElementById('svgEntgraten'), roEg=document.getElementById('roEntgraten');
function buildEntgraten(){
  drawBase(svgEg);
  const cleanups=[]; buildEntgraten._cleanup=()=>cleanups.forEach(f=>f());
  const cx=195, cy=440, R=95;  // zoom close-up of pipe end
  const zlbl=el('text',{x:cx,y:300,'text-anchor':'middle','font-size':'10','font-weight':'800',fill:'#5a5446'});
  zlbl.textContent='Zoom: geschnittenes Rohrende'; svgEg.appendChild(zlbl);
  // pipe end cross-section (tube ring)
  const grad = RUN.variant==='alu'?'url(#pipeAlu)':'url(#pipeKir)';
  svgEg.appendChild(el('circle',{cx,cy,r:R+6,fill:'#000',opacity:0.25,filter:'url(#soft)'}));
  svgEg.appendChild(el('circle',{cx,cy,r:R,fill:grad,stroke:'#4f545c','stroke-width':2}));
  svgEg.appendChild(el('circle',{cx,cy,r:R-22,fill:'#23272d',stroke:'#11151b','stroke-width':2}));  // bore
  // burr (jagged spikes around the rim)
  const burrG=el('g',{});
  const spikes=16;
  for(let i=0;i<spikes;i++){
    const a=i/spikes*Math.PI*2;
    const r0=R-2, r1=R+5+Math.random()*5;
    const x0=cx+Math.cos(a)*r0, y0=cy+Math.sin(a)*r0;
    const x1=cx+Math.cos(a+0.07)*r1, y1=cy+Math.sin(a+0.07)*r1;
    const x2=cx+Math.cos(a+0.14)*r0, y2=cy+Math.sin(a+0.14)*r0;
    burrG.appendChild(el('path',{d:`M ${x0} ${y0} L ${x1} ${y1} L ${x2} ${y2} Z`,fill:'#9aa0a8',stroke:'#5a606a','stroke-width':0.5}));
  }
  svgEg.appendChild(burrG);

  let entered=false, done=false;
  // deburring tool (reamer / Senker)
  const home={x:300,y:700};
  const tool=el('g',{cursor:'grab',class:'pulseTool'});
  tool.appendChild(el('rect',{x:-6,y:-2,width:12,height:46,rx:4,fill:'#1d2531',stroke:'#10151c','stroke-width':1}));
  tool.appendChild(el('path',{d:'M -10 -2 L 10 -2 L 0 -22 Z',fill:'url(#steel)',stroke:'#3f4751','stroke-width':1}));
  svgEg.appendChild(tool);
  const tt={x:home.x,y:home.y};
  function draw(){ tool.setAttribute('transform','translate('+tt.x+','+tt.y+')'); }
  draw();

  roEg.classList.remove('good','bad');
  roEg.innerHTML='Entgrat-Werkzeug ueber das <span class="big">Rohrende</span> ziehen';

  cleanups.push(dragTarget(svgEg,tool,
    (p)=>{ if(done)return; tt.x=p.x; tt.y=p.y; draw();
      const d=Math.hypot(cx-p.x,cy-p.y);
      if(d<R+6){ entered=true; const k=Math.max(0,Math.min(1,(burrG.getAttribute('opacity')||1))); burrG.setAttribute('opacity', Math.max(0, 1-(R+6-d)/(R)*1.4 )); }
    },
    (p)=>{ if(done)return;
      const d=Math.hypot(cx-p.x,cy-p.y);
      if(entered && d<R+10){
        done=true; burrG.setAttribute('opacity',0); tool.classList.remove('pulseTool');
        // smooth chamfer rim highlight
        svgEg.appendChild(el('circle',{cx,cy,r:R,fill:'none',stroke:'#7af0d9','stroke-width':2.5,opacity:0.85}));
        sndScrew(); spark(cx,cy,18,{color:'#cdd5dd',speed:3}); toast('entgratet','#7af0d9',cx,cy-R-10);
        roEg.classList.add('good'); roEg.textContent='Rohrende sauber entgratet';
        addXp(8); setTimeout(()=>nextStep(),850);
      } else { tt.x=home.x; tt.y=home.y; draw(); burrG.setAttribute('opacity',1); }
    },
    ()=>{ tool.classList.remove('pulseTool'); }
  ));
  if(firstVisit('entgraten')){
    showDoHint('hintEntgraten','Zieh das <b>Werkzeug</b> ueber das Rohrende, bis der <b>Grat</b> weg ist.',5200);
    ghostDemo(svgEg,home.x,home.y,cx,cy,{dur:1200});
  } else hideDoHint('hintEntgraten');
}

      if(t && t.d<32){

          roSc.innerHTML='Fixiert: <span class="big">'+fixed+'/'+total+'</span>';
          if(fixed===total){ roSc.classList.add('good'); roSc.textContent='Alle Briden fest verschraubt'; setTimeout(()=>nextStep(),850); }
        } else { s.x=s.home.x; s.y=s.home.y; draw(); targets.forEach(t=>{ if(!t.fixed) t.ring.setAttribute('opacity',0.8); }); }
      },
      ()=>{ g.classList.remove('pulseTool'); }
    ));
  }
  if(firstVisit('schrauben')){
    showDoHint('hintSchrauben','Zieh die <b>Schrauben</b> in die gebohrten Loecher der Briden.',5200);
    ghostDemo(svgSc,90,trayY+18,targets[0].x,targets[0].y,{dur:1200});
  } else hideDoHint('hintSchrauben');
}

/* =============================================================
 *  STEP — ROHR einsetzen (drag pipe into the briden)
 * ============================================================= */
const svgRo=document.getElementById('svgRohr'), roRo=document.getElementById('roRohr');
function buildRohr(){
  drawBase(svgRo);
  const cleanups=[]; buildRohr._cleanup=()=>cleanups.forEach(f=>f());
  // fixed briden waiting for the pipe
  BRIDEN_Y.forEach(y=>drawBride(svgRo,PIPE_X,y,'fixed'));
  // target ghost (where pipe goes)
  const ghost=el('rect',{x:PIPE_X-pipeW()/2,y:PIPE_TOP,width:pipeW(),height:PIPE_BOT-PIPE_TOP,rx:pipeW()/2,fill:'none',stroke:'#7af0d9','stroke-width':2,'stroke-dasharray':'6 7',opacity:0.7,class:'zonePulse'});
  svgRo.appendChild(ghost);

  let done=false;
  // draggable pipe group (starts offset to the right, slightly tilted)
  const grad = RUN.variant==='alu'?'url(#pipeAlu)':'url(#pipeKir)';
  const w=pipeW(), top=PIPE_TOP, bot=PIPE_BOT;
  const pipe=el('g',{cursor:'grab',class:'pulseTool'});
  pipe.appendChild(el('rect',{x:-w/2,y:top,width:w,height:bot-top,rx:w/2,fill:grad,stroke:RUN.variant==='alu'?'#7d858f':'#565d66','stroke-width':1.4}));
  pipe.appendChild(el('rect',{x:-w/2+4,y:top+3,width:3.5,height:bot-top-6,rx:2,fill:'#fff',opacity:RUN.variant==='alu'?0.6:0.32}));
  svgRo.appendChild(pipe);
  let off=96, rot=8;
  function draw(){ pipe.setAttribute('transform','translate('+(PIPE_X+off)+',0) rotate('+rot+','+0+','+((top+bot)/2)+')'); }
  draw();

  roRo.classList.remove('good','bad');
  roRo.innerHTML='Rohr in die <span class="big">Briden</span> einsetzen';

  cleanups.push(dragTarget(svgRo,pipe,
    (p)=>{ if(done)return; off=p.x-PIPE_X; rot=Math.max(0,Math.min(12,Math.abs(off)/9)); draw();
      ghost.setAttribute('opacity', Math.abs(off)<26?1:0.7); },
    (p)=>{ if(done)return;
      if(Math.abs(off)<28){
        done=true; off=0; rot=0; draw(); pipe.classList.remove('pulseTool'); pipe.setAttribute('cursor','default');
        ghost.setAttribute('opacity',0);
        // redraw briden in front so it looks clamped
        BRIDEN_Y.forEach(y=>drawBride(svgRo,PIPE_X,y,'fixed'));
        sndSnap(); BRIDEN_Y.forEach(y=>spark(PIPE_X,y,10,{color:'#2dd4bf',speed:2.4}));
        toast('eingeklickt','#7af0d9',PIPE_X,top-10);
        roRo.classList.add('good'); roRo.textContent='Rohr sitzt fest in den Briden';
        addXp(10); setTimeout(()=>nextStep(),900);
      } else { /* snap back partway, keep draggable */ off = off<0?-96:96; rot=8; draw(); ghost.setAttribute('opacity',0.7); sndBuzz(); }
    },
    ()=>{ pipe.classList.remove('pulseTool'); }
  ));
  if(firstVisit('rohr')){
    showDoHint('hintRohr','Zieh das <b>Rohr</b> nach links in die Briden, bis es einklickt.',5200);
    ghostDemo(svgRo,PIPE_X+off,(top+bot)/2,PIPE_X,(top+bot)/2,{dur:1200});
  } else hideDoHint('hintRohr');
}

/* =============================================================
 *  STEP — KABEL einziehen (drag cable head top -> bottom)
 * ============================================================= */
const svgKa=document.getElementById('svgKabel'), roKa=document.getElementById('roKabel');
function buildKabel(){
  drawBase(svgKa);
  const cleanups=[]; buildKabel._cleanup=()=>cleanups.forEach(f=>f());
  BRIDEN_Y.forEach(y=>drawBride(svgKa,PIPE_X,y,'fixed'));
  drawPipe(svgKa);
  BRIDEN_Y.forEach(y=>drawBride(svgKa,PIPE_X,y,'fixed')); // clamps in front

  const w=pipeW();
  const nAd = RUN.variant==='alu' ? 5 : 3;
  const cols = RUN.variant==='alu' ? [COL.L1,COL.L2,COL.L3,COL.N,COL.PE] : [COL.L,COL.N,COL.PE];
  // adern lines inside the pipe (drawn progressively)
  const adern=cols.map((c,i)=>{
    const ox=(i-(nAd-1)/2)*(w*0.5/Math.max(1,nAd-1));
    const ln=el('line',{x1:PIPE_X+ox,y1:PIPE_TOP+4,x2:PIPE_X+ox,y2:PIPE_TOP+4,stroke:c,'stroke-width':3,'stroke-linecap':'round'});
    svgKa.appendChild(ln);
    return {ln,ox,c};
  });
  // entry funnel top + exit target bottom
  svgKa.appendChild(el('circle',{cx:PIPE_X,cy:PIPE_BOT+8,r:18,fill:'none',stroke:'#7af0d9','stroke-width':2,'stroke-dasharray':'4 5',opacity:0.8,class:'zonePulse'}));
  const exitLbl=el('text',{x:PIPE_X,y:PIPE_BOT+40,'text-anchor':'middle','font-size':'9','font-weight':'800',fill:'#5a5446'}); exitLbl.textContent='Auslass'; svgKa.appendChild(exitLbl);

  let done=false;
  // cable head (Einziehkopf) at top
  const head=el('g',{cursor:'grab',class:'pulseTool'});
  head.appendChild(el('circle',{cx:0,cy:0,r:11,fill:'url(#copper)',stroke:'#7a4a1c','stroke-width':1.6}));
  adern.forEach(a=>head.appendChild(el('line',{x1:a.ox,y1:0,x2:a.ox,y2:-14,stroke:a.c,'stroke-width':3,'stroke-linecap':'round'})));
  svgKa.appendChild(head);
  const hp={x:PIPE_X,y:PIPE_TOP-6};
  function drawHead(){ head.setAttribute('transform','translate('+hp.x+','+hp.y+')'); }
  drawHead();

  roKa.classList.remove('good','bad');
  roKa.innerHTML='Adern von oben durch das Rohr <span class="big">nach unten</span> ziehen';

  function setFill(y){
    const yy=Math.max(PIPE_TOP+4,Math.min(PIPE_BOT-4,y));
    adern.forEach(a=>a.ln.setAttribute('y2',yy));
  }
  cleanups.push(dragTarget(svgKa,head,
    (p)=>{ if(done)return; hp.x=PIPE_X; hp.y=Math.max(PIPE_TOP-6,p.y); drawHead(); setFill(p.y); },
    (p)=>{ if(done)return;
      if(p.y>=PIPE_BOT-12){
        done=true; setFill(PIPE_BOT-4); hp.y=PIPE_BOT-6; drawHead(); head.classList.remove('pulseTool');
        sndSnap(); spark(PIPE_X,PIPE_BOT+6,16,{color:'#e08e3c',speed:3}); toast('eingezogen','#7af0d9',PIPE_X,PIPE_BOT-10);
        roKa.classList.add('good'); roKa.textContent='Adern komplett durchgezogen';
        addXp(10); setTimeout(()=>nextStep(),900);
      } else { hp.y=PIPE_TOP-6; drawHead(); setFill(PIPE_TOP+4); }
    },
    ()=>{ head.classList.remove('pulseTool'); }
  ));
  if(firstVisit('kabel')){
    showDoHint('hintKabel','Zieh den <b>Einziehkopf</b> von oben bis unten durch das Rohr.',5200);
    ghostDemo(svgKa,PIPE_X,PIPE_TOP,PIPE_X,PIPE_BOT,{dur:1400});
  } else hideDoHint('hintKabel');
}

/* =============================================================
 *  STEP — DOSE anschliessen (edge-pad Klemmen-Mechanik)
 *  Echte AP-Dose (Aufputz) aus {T13,T23,T15,T25}, KEIN CEE.
 *  T13/T23 -> 3-polig (L/N/PE).  T15/T25 -> 5-polig (L1/L2/L3/N/PE).
 * ============================================================= */
const svgDo=document.getElementById('svgDose'), roDo=document.getElementById('roDose');
function doseIs5(){ return RUN.dose==='T15' || RUN.dose==='T25'; }
function doseDefs(){
  if(doseIs5()){
    // Reihenfolge je Seite = oben->unten: L2 oben-links, L1 unten-links; L3 oben-rechts, N unten-rechts.
    return [
      {id:'L2',col:COL.L2,label:'L2',name:'L2 schwarz',side:'L'},
      {id:'L1',col:COL.L1,label:'L1',name:'L1 braun',  side:'L'},
      {id:'L3',col:COL.L3,label:'L3',name:'L3 grau',   side:'R'},
      {id:'N', col:COL.N, label:'N', name:'N blau',    side:'R'},
      {id:'PE',col:COL.PE,label:'PE',name:'PE gruengelb',side:'B', pe:true}
    ];
  }
  return [
    {id:'N', col:COL.N, label:'N', name:'N blau',      side:'L'},
    {id:'L', col:COL.L, label:'L', name:'L braun',     side:'R'},
    {id:'PE',col:COL.PE,label:'PE',name:'PE gruengelb',side:'B', pe:true}
  ];
}
function buildDose(){
  drawBase(svgDo);
  const cleanups=[]; buildDose._cleanup=()=>cleanups.forEach(f=>f());
  const cx=195, cy=400, R=95;          // kleiner als im Steckdosen-Game (122)
  const defs=doseDefs();
  const five=doseIs5();

  // a short stub of pipe coming into the dose from above
  drawPipe(svgDo,{top:PIPE_TOP,bot:cy-R-4});

  // ---- Aufputz-Gehaeuse (erhoehter Sockel hinter der Dose) ----
  const apR=R+18;
  svgDo.appendChild(el('rect',{x:cx-apR+3,y:cy-apR+9,width:apR*2,height:apR*2,rx:26,fill:'#000',opacity:0.34,filter:'url(#soft)'}));  // weicher Schlagschatten
  svgDo.appendChild(el('rect',{x:cx-apR,y:cy-apR,width:apR*2,height:apR*2,rx:26,fill:'url(#apBox)',stroke:'#b7ae98','stroke-width':2,filter:'url(#ds)'}));
  svgDo.appendChild(el('rect',{x:cx-apR+2,y:cy-apR+2,width:apR*2-4,height:6,rx:3,fill:'#ffffff',opacity:0.45}));            // obere Lichtkante
  svgDo.appendChild(el('rect',{x:cx-apR+6,y:cy-apR+6,width:apR*2-12,height:apR*2-12,rx:20,fill:'none',stroke:'#d8cfb6','stroke-width':1.4}));

  // ---- echtes Dosen-Foto ----
  const file='sockimg/'+(RUN.dose||'T13').toLowerCase()+'ap.png';   // echte Aufputz-Dosen
  const dimg=el('image',{x:cx-R,y:cy-R,width:R*2,height:R*2,href:file,preserveAspectRatio:'xMidYMid meet'});
  dimg.setAttributeNS('http://www.w3.org/1999/xlink','href',file);
  svgDo.appendChild(dimg);

  const tl=el('text',{x:cx,y:cy-apR-10,'text-anchor':'middle','font-size':'11','font-weight':'900',fill:'#9fb0c0'});
  tl.textContent=(RUN.dose||'')+' · Aufputz · '+(five?'5-polig 400 V':'3-polig 230 V'); svgDo.appendChild(tl);

  // ---- edge pads ----
  const padX={L:cx-R-2, R:cx+R+2};
  const sideCount={L:0,R:0,B:0}; defs.forEach(d=>sideCount[d.side]++);
  const sideIdx={L:0,R:0,B:0};
  const terms=[];
  defs.forEach(d=>{
    let tx,ty,anchorX,anchorY,pillAnchor;
    if(d.side==='B'){ tx=cx; ty=cy+R+30; anchorX=cx; anchorY=cy+R; pillAnchor='middle'; }
    else{
      const n=sideCount[d.side], i=sideIdx[d.side]++;
      const span=n>1?86:0;
      ty=cy-span/2+(n>1?span*(i/(n-1)):0)-6;
      if(d.side==='L'){ tx=padX.L; anchorX=cx-R+10; pillAnchor='end'; }
      else{ tx=padX.R; anchorX=cx+R-10; pillAnchor='start'; }
      anchorY=ty;
    }
    const term={id:d.id,col:d.col,label:d.label,name:d.name,pe:d.pe,x:tx,y:ty,_wired:false};
    term._line=el('line',{x1:tx,y1:ty,x2:anchorX,y2:anchorY,stroke:'rgba(255,255,255,.34)','stroke-width':2,'stroke-dasharray':'4 5','stroke-linecap':'round'});
    svgDo.appendChild(term._line);
    const g=el('g',{});
    const pw=d.label.length>1?54:46, ph=24;
    let px;
    if(pillAnchor==='end') px=tx-pw; else if(pillAnchor==='start') px=tx; else px=tx-pw/2;
    const py=ty-ph/2;
    g.appendChild(el('rect',{x:px,y:py,width:pw,height:ph,rx:ph/2,fill:'rgba(16,22,30,.86)',stroke:'rgba(255,255,255,.16)','stroke-width':1,filter:'url(#ds)'}));
    const dotX=px+13;
    term._dot=el('circle',{cx:dotX,cy:ty,r:6.2,fill:d.col,stroke:'#0c1117','stroke-width':1.4}); g.appendChild(term._dot);
    if(d.pe) g.appendChild(el('rect',{x:dotX-5,y:ty-1.6,width:10,height:3.2,fill:COL.PEY,opacity:0.95}));
    const lbT=el('text',{x:px+pw/2+7,y:ty+4,'text-anchor':'middle','font-size':'11.5','font-weight':'800',fill:'#e8edf2'}); lbT.textContent=d.label; g.appendChild(lbT);
    svgDo.appendChild(g);
    term._zone=el('rect',{x:px-5,y:py-5,width:pw+10,height:ph+10,rx:(ph+10)/2,fill:'none',stroke:d.col,'stroke-width':2.6,opacity:0});
    svgDo.appendChild(term._zone);
    term.x=px+pw/2; term.y=ty;
    terms.push(term);
  });

  // ---- loose wires from below ----
  const magY=706;
  svgDo.appendChild(el('rect',{x:16,y:magY-30,width:358,height:96,rx:14,fill:'#1a212c',opacity:0.5,stroke:'rgba(255,255,255,.06)','stroke-width':1}));
  const magLbl=el('text',{x:30,y:magY-14,'font-size':'9','font-weight':'800',fill:'#7c7466'}); magLbl.textContent='Adern aus dem Rohr'; svgDo.appendChild(magLbl);

  const adern=terms.slice();
  const n=adern.length, spread=330, x0=cx-spread/2;
  adern.forEach((a,i)=>{
    a._homeX=x0+(n>1?spread*(i/(n-1)):0); a._homeY=magY+24;
    a._anchorX=a._homeX; a._anchorY=838;
    a._x=a._homeX; a._y=a._homeY;
    a._wire=el('path',{d:'',fill:'none',stroke:a.col,'stroke-width':8,'stroke-linecap':'round',filter:'url(#ds)'}); svgDo.appendChild(a._wire);
    if(a.pe){ a._stripe=el('path',{d:'',fill:'none',stroke:COL.PEY,'stroke-width':3.4,'stroke-linecap':'round','stroke-dasharray':'7 7'}); svgDo.appendChild(a._stripe); }
    a._tip=el('g',{cursor:'grab',class:'pulseTool'});
    a._tip.appendChild(el('circle',{cx:0,cy:0,r:13,fill:'url(#copper)',stroke:'#7a4a1c','stroke-width':1.6}));
    a._tip.appendChild(el('rect',{x:-3.5,y:-3,width:7,height:16,rx:2,fill:'url(#copper)',stroke:'#7a4a1c','stroke-width':1}));
    const cl=el('text',{x:0,y:34,'text-anchor':'middle','font-size':'9.5','font-weight':'900',fill:'#cdd5dd'}); cl.textContent=a.name; a._tip.appendChild(cl);
    svgDo.appendChild(a._tip);
    a._done=false; redrawWire(a);
    a._tip.addEventListener('pointerdown',(e)=>downA(e,a));
  });
  function redrawWire(a){
    const mx=(a._anchorX+a._x)/2+16, my=(a._anchorY+a._y)/2;
    const d='M '+a._anchorX+' '+a._anchorY+' Q '+mx+' '+my+' '+a._x+' '+a._y;
    a._wire.setAttribute('d',d); if(a._stripe) a._stripe.setAttribute('d',d);
    a._tip.setAttribute('transform','translate('+a._x+','+a._y+')');
  }
  let wiredCount=0; const totalW=adern.length;
  roDo.classList.remove('good','bad'); roDo.innerHTML='Geklemmt: <span class="big">0/'+totalW+'</span>';

  let dragA=null;
  function downA(e,a){ if(a._done)return; e.preventDefault(); AC(); sndPick(); dragA=a;
    a._tip.setAttribute('cursor','grabbing'); a._tip.classList.remove('pulseTool'); hideDoHint('hintDose');
    try{a._tip.setPointerCapture(e.pointerId);}catch(_){}
  }
  function moveA(e){ if(!dragA)return; const p=toSvgFor(svgDo,e.clientX,e.clientY); dragA._x=p.x; dragA._y=p.y; redrawWire(dragA);
    terms.forEach(t=>{ if(t._wired)return; const dx=t.x-p.x,dy=t.y-p.y; t._zone.setAttribute('opacity',(t.id===dragA.id && dx*dx+dy*dy<42*42)?0.9:0); });
  }
  function upA(){ if(!dragA)return; const a=dragA; dragA=null; a._tip.setAttribute('cursor','grab');
    const t=terms.find(t=>t.id===a.id);
    const dx=t.x-a._x, dy=t.y-a._y;
    const onTarget=!t._wired && dx*dx+dy*dy<36*36;
    if(onTarget){
      a._done=true; t._wired=true; a._x=t.x; a._y=t.y; redrawWire(a); t._zone.setAttribute('opacity',0);
      if(t._dot){ t._dot.setAttribute('r',5.5); t._dot.setAttribute('fill','#2dd4bf'); }
      sndSnap(); spark(t.x,t.y,14,{color:a.col,speed:2.8}); toast(a.label+' ok','#7af0d9',t.x,t.y-26);
      addXp(8); wiredCount++;
      roDo.innerHTML='Geklemmt: <span class="big">'+wiredCount+'/'+totalW+'</span>';
      if(wiredCount===totalW){
        roDo.classList.add('good'); roDo.textContent='Alle Adern korrekt geklemmt';
        terms.forEach(t=>t._zone.setAttribute('opacity',0));
        spark(cx,cy,28,{color:'#2dd4bf',speed:4,up:1});
        setTimeout(()=>nextStep(),900);
      }
    } else {
      const wrong=terms.find(tt=>{ if(tt._wired||tt.id===a.id) return false; const ddx=tt.x-a._x,ddy=tt.y-a._y; return ddx*ddx+ddy*ddy<30*30; });
      if(wrong){
        sndBuzz(); shakeStage();
        roDo.classList.add('bad'); roDo.textContent=a.name+' gehoert an Klemme '+a.label+', nicht '+wrong.label;
        toast('falsche Klemme','#ff6b6b',a._x,a._y-20);
        setTimeout(()=>{ roDo.classList.remove('bad'); roDo.innerHTML='Geklemmt: <span class="big">'+wiredCount+'/'+totalW+'</span>'; },1500);
      }
      a._x=a._homeX; a._y=a._homeY; redrawWire(a); terms.forEach(t=>t._zone.setAttribute('opacity',0));
    }
  }
  svgDo.addEventListener('pointermove',moveA);
  window.addEventListener('pointerup',upA);
  cleanups.push(()=>{ svgDo.removeEventListener('pointermove',moveA); window.removeEventListener('pointerup',upA); });

  if(firstVisit('dose')){
    showDoHint('hintDose','Zieh jede <b>Ader</b> auf die passende <b>Klemme</b> (Farbe = Klemme).',5400);
    const a0=adern[0], t0=terms.find(t=>t.id===a0.id);
    ghostDemo(svgDo,a0._x,a0._y,t0.x,t0.y,{dur:1200});
  } else hideDoHint('hintDose');
}

/* =============================================================
 *  WIN
 * ============================================================= */
function triggerWin(){
  document.getElementById('progFill').style.width='100%';
  const isAlu=RUN.variant==='alu';
  const five=doseIs5();
  document.getElementById('winType').textContent =
    (isAlu?'Industrie ALU-Rohr':'KIR-Rohr')+' montiert & '+(RUN.dose||'Dose')+' angeschlossen';
  document.getElementById('winNote').textContent = five
    ? 'L1 braun · L2 schwarz · L3 grau · N blau · PE gelb-gruen'
    : 'L braun · N blau · PE gelb-gruen';
  setTimeout(()=>{ sndWin(); burstConfetti();
    spark(STAGE_W/2,STAGE_H*0.42,42,{color:'#ffd166',speed:6,up:2});
    spark(STAGE_W/2,STAGE_H*0.42,30,{color:'#2dd4bf',speed:5,up:1});
  },200);
  setTimeout(()=>{
    const win=document.getElementById('win'); win.classList.add('show');
    const sts=document.querySelectorAll('#stars .st');
    sts.forEach((s,i)=>setTimeout(()=>{s.classList.add('lit');sndSnap();},300+i*260));
    const xb=document.getElementById('xpBig'); const tt=performance.now();
    (function cc(t){const k=Math.min(1,(t-tt)/900);const v=Math.round(120*(1-Math.pow(1-k,3)));xb.textContent='+'+v+' XP';if(k<1)requestAnimationFrame(cc);})(performance.now());
    addXp(50);
    if(typeof window.__onIntroDone==='function'){ try{window.__onIntroDone();}catch(e){} }
  },1000);
}
document.getElementById('again').onclick=()=>location.reload();

/* =============================================================
 *  BUILDERS registry
 * ============================================================= */
const BUILDERS = {
  laser:buildLaser, briden:buildBriden, endmuffen:buildEndmuffen, entgraten:buildEntgraten,
  bohren:buildBohren, schrauben:buildSchrauben, rohr:buildRohr, kabel:buildKabel, dose:buildDose
};

/* =============================================================
 *  MAIN LOOP + dust + boot
 * ============================================================= */
let dust=[];
function initDust(){
  for(let i=0;i<22;i++) dust.push({
    x:Math.random()*STAGE_W,y:Math.random()*STAGE_H,
    vy:-(0.1+Math.random()*0.25),vx:(Math.random()-.5)*0.2,
    r:0.5+Math.random()*1.4,a:0.05+Math.random()*0.18,ph:Math.random()*6.28
  });
}
function boot(){
  sizeCanvas();
  initDust();
  newRun();
  buildStepList();
  buildStepsBar();
  fxLoop();
  gotoStep('laser');
}
window.addEventListener('resize',sizeCanvas);
boot();

})();
