<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LernStrom — Flachband Ladeinfrastruktur</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 30%, #1a2230 0%, #0c1018 70%, #06080d 100%);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8edf2;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:390px;height:844px;
    max-height:100vh;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 10px #0a0d13, 0 0 0 12px #1c232e, inset 0 0 60px rgba(0,0,0,.4);
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(45,212,191,.08), transparent 60%),
      linear-gradient(180deg,#3a4250 0%, #2a323e 30%, #20262f 70%, #171c24 100%);
  }
  @media (max-height:860px){ #stage{transform:scale(calc(100vh / 860));} }

  #stage::after{
    content:"";position:absolute;inset:0;border-radius:34px;pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.55), inset 0 -40px 80px rgba(0,0,0,.5);
    background:radial-gradient(140% 90% at 50% 120%, rgba(70,80,95,.14), transparent 55%);
    z-index:60;
  }

  canvas#fx{position:absolute;inset:0;z-index:40;pointer-events:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:50;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;}
  .badge{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .badge .dot{width:9px;height:9px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf;}
  #xpBadge{color:#ffd166;}
  #xpBadge .ico{display:inline-block;width:13px;height:13px;
    background:#ffd166;clip-path:polygon(58% 0,0 60%,42% 60%,42% 100%,100% 40%,58% 40%);
    filter:drop-shadow(0 0 5px rgba(255,209,102,.6));}
  .spacer{flex:1;}
  #mute{
    width:38px;height:38px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  #mute svg{width:18px;height:18px;}
  #mute:active{transform:scale(.92);}

  #prog{position:absolute;top:58px;left:16px;right:16px;z-index:50;height:8px;border-radius:6px;
    background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  #progFill{height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#2dd4bf,#7af0d9);transition:width .5s cubic-bezier(.2,1.3,.4,1);
    box-shadow:0 0 12px rgba(45,212,191,.7);}

  #steps{position:absolute;top:38px;left:16px;right:16px;z-index:49;display:flex;gap:4px;justify-content:center;pointer-events:none;}
  #steps .sc{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);transition:background .4s, box-shadow .4s;}
  #steps .sc.done{background:linear-gradient(90deg,#2dd4bf,#7af0d9);box-shadow:0 0 8px rgba(45,212,191,.6);}
  #steps .sc.cur{background:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.7);}

  /* ---------- title / instruction (nicht-blockierend) ---------- */
  #task{position:absolute;top:74px;left:0;right:0;z-index:50;text-align:center;pointer-events:none;padding:0 14px;transition:opacity .6s, transform .6s;}
  #task.faded{opacity:0;transform:translateY(-8px);pointer-events:none;}
  #task.hidden{opacity:0!important;transform:translateY(-8px);pointer-events:none!important;}
  #task h1{font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #task p{font-size:12px;margin-top:3px;color:#9fb0c0;font-weight:600;line-height:1.4;}
  #taskToggle{position:absolute;top:96px;right:12px;z-index:58;cursor:pointer;
    font-size:10px;font-weight:800;color:#9fb0c0;background:rgba(10,14,20,.55);
    border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:4px 9px;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);user-select:none;-webkit-user-select:none;}
  #taskToggle:active{transform:scale(.94);}

  .prep{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .55s;}
  .prep.on{opacity:1;pointer-events:auto;}
  .prep svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

  .readout{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:35;
    font-size:13px;font-weight:800;color:#fff;background:linear-gradient(180deg,#202a37,#141a23);
    padding:7px 16px;border-radius:20px;border:1px solid rgba(45,212,191,.3);
    box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;text-align:center;min-width:180px;}
  .readout .big{color:#7af0d9;font-size:16px;}
  .readout.bad{border-color:#ff6b6b;color:#ffb3b3;}
  .readout.good{border-color:#2dd4bf;}

  .doHint{position:absolute;left:12px;top:120px;z-index:36;max-width:188px;
    font-size:11.5px;font-weight:800;color:#fff;text-align:left;line-height:1.4;
    background:linear-gradient(180deg,rgba(32,42,55,.95),rgba(20,26,35,.95));
    padding:9px 16px;border-radius:16px;border:1px solid rgba(45,212,191,.4);
    box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 22px rgba(45,212,191,.18);
    pointer-events:none;opacity:0;transition:opacity .4s;}
  .doHint.on{opacity:1;}
  .doHint b{color:#7af0d9;}

  .toast{position:absolute;z-index:55;font-weight:900;font-size:15px;pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:toastUp 1s ease-out forwards;}
  @keyframes toastUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

  .shake{animation:shakeStage .35s;}
  @keyframes shakeStage{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}

  .pulseTool{animation:toolPulse 1.1s ease-in-out infinite;}
  @keyframes toolPulse{0%,100%{filter:drop-shadow(0 0 1px rgba(45,212,191,.3))}50%{filter:drop-shadow(0 0 10px rgba(45,212,191,.95)) drop-shadow(0 0 4px rgba(122,240,217,.9))}}

  #win{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(45,212,191,.18), rgba(6,9,14,.86) 60%);
    backdrop-filter:blur(2px);}
  #win.show{display:flex;animation:winIn .5s;}
  @keyframes winIn{from{opacity:0}to{opacity:1}}
  #win .card{
    width:300px;padding:26px 22px 24px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,#222d3a,#161d27);
    border:1px solid rgba(45,212,191,.3);
    box-shadow:0 30px 70px rgba(0,0,0,.7), 0 0 40px rgba(45,212,191,.2), inset 0 1px 0 rgba(255,255,255,.06);
    transform:scale(.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes pop{to{transform:scale(1)}}
  #win h2{font-size:22px;font-weight:900;color:#fff;letter-spacing:.5px;}
  #win .sub{font-size:13px;color:#9fb0c0;margin-top:5px;font-weight:600;}
  #stars{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;}
  #stars .st{font-size:34px;color:#2a3340;transform:scale(0);line-height:1;}
  #stars .st.lit{color:#ffd166;text-shadow:0 0 16px rgba(255,209,102,.8);animation:starPop .5s cubic-bezier(.2,1.8,.4,1) forwards;}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  #xpBig{font-size:30px;font-weight:900;color:#ffd166;margin:8px 0 4px;text-shadow:0 0 18px rgba(255,209,102,.5);}
  #win .ok{margin-top:16px;padding:12px 0;border-radius:14px;cursor:pointer;font-weight:800;font-size:15px;color:#06281f;
    background:linear-gradient(180deg,#5cf0d6,#2dd4bf);box-shadow:0 8px 20px rgba(45,212,191,.4);}
  #win .ok:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="stage">

  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="badge"><span class="dot"></span><span id="phaseLbl">Schritt 1</span></div>
    <div class="spacer"></div>
    <div class="badge" id="xpBadge"><span class="ico"></span><span id="xpVal">0</span> XP</div>
    <div id="mute"></div>
  </div>

  <div id="steps"></div>
  <div id="prog"><div id="progFill"></div></div>

  <div id="task">
    <h1 id="taskTitle">Flachband verlegen</h1>
    <p id="taskSub">Ladeinfrastruktur E-Auto + Garagentor</p>
  </div>
  <div id="taskToggle">Aufgabe ausblenden</div>

  <!-- SCENES -->
  <div class="prep" id="pLay"><svg id="svgLay" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintLay"></div><div class="readout" id="roLay">Flachband verlegen</div></div>
  <div class="prep" id="pTap"><svg id="svgTap" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintTap"></div><div class="readout" id="roTap">Abgriffe setzen</div></div>
  <div class="prep" id="pLoad"><svg id="svgLoad" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintLoad"></div><div class="readout" id="roLoad">Anschliessen</div></div>
  <div class="prep" id="pFuse"><svg id="svgFuse" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintFuse"></div><div class="readout" id="roFuse">Absichern + pruefen</div></div>

  <!-- WIN -->
  <div id="win">
    <div class="card">
      <h2>STROM AM LADEPUNKT!</h2>
      <div class="sub">Ladeinfrastruktur &amp; Garagentor versorgt</div>
      <div id="stars"><span class="st">&#9733;</span><span class="st">&#9733;</span><span class="st">&#9733;</span></div>
      <div id="xpBig">+0 XP</div>
      <div class="sub" id="winNote">Flachband &middot; Abgriffe &middot; FI/LS gesetzt</div>
      <div class="ok" id="again">Nochmal spielen</div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";
/* ============================================================= *
 *  LernStrom — Flachband-Installation Ladeinfrastruktur (TG)    *
 *  CH / NIN 2025: Flachbandkabel / Stromschiene an der Decke    *
 *  verlegen, Abgriffe (Tap-off) fuer E-Auto-Ladestationen +     *
 *  Garagentor-Antrieb setzen, korrekt anschliessen, absichern   *
 *  (LS + FI Typ B / RDC-DD) und pruefen.                        *
 *  Pure SVG + Canvas FX + WebAudio. Keine Emojis.               *
 * ============================================================= */

const STAGE_W = 390, STAGE_H = 844;
const SVGNS   = "http://www.w3.org/2000/svg";
const stage   = document.getElementById('stage');
const fx      = document.getElementById('fx');
const ctx     = fx.getContext('2d');

/* =============================================================
 *  AUDIO
 * ============================================================= */
let audioCtx=null, muted=true;
function AC(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return audioCtx; }
function tone(freq, dur, type, vol, slideTo){
  if(muted) return; const c=AC(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(vol||0.2, c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime+dur+0.02);
}
function sndClick(){ tone(680,0.07,'triangle',0.25,1200); setTimeout(()=>tone(1500,0.05,'sine',0.12),20); }
function sndSnap(){ tone(440,0.05,'square',0.18,900); setTimeout(()=>tone(1320,0.12,'triangle',0.22),30); }
function sndPunch(){ tone(300,0.08,'square',0.22,140); setTimeout(()=>tone(1100,0.06,'triangle',0.16),40); }
function sndPick(){ tone(520,0.05,'sine',0.14,720); }
function sndPower(){ tone(700,0.05,'sine',0.12,1300); setTimeout(()=>tone(1500,0.18,'triangle',0.16),40); }
function sndBad(){ tone(180,0.18,'sawtooth',0.2,90); }
function sndWin(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*110)); }

const muteBtn=document.getElementById('mute');
const ICON_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="#9fb0c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="#9fb0c0"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/></svg>';
const ICON_SND='<svg viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="#2dd4bf"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
muteBtn.innerHTML=ICON_MUTE;
muteBtn.onclick=function(){
  muted=!muted; this.innerHTML=muted?ICON_MUTE:ICON_SND;
  if(!muted){ AC(); tone(880,0.06,'sine',0.15); }
};

/* =============================================================
 *  PARTICLE / FX ENGINE
 * ============================================================= */
function sizeCanvas(){
  const r=stage.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  fx.width=STAGE_W*dpr; fx.height=STAGE_H*dpr;
  fx.style.width=r.width+'px'; fx.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
let particles=[];
function spark(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(opt.speed||3)*(0.4+Math.random());
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
      life:1, decay:0.012+Math.random()*0.02,
      size:(opt.size||2.4)*(0.6+Math.random()),
      color:opt.color|| (Math.random()<.5?'#ffd166':'#cfd6de'),
      grav:opt.grav!=null?opt.grav:0.06, glow:opt.glow!==false
    });
  }
}
let confetti=[];
function burstConfetti(){
  const cols=['#2dd4bf','#ffd166','#ff6b6b','#7af0d9','#ffffff','#9aa0a6','#8ab4ff'];
  for(let i=0;i<140;i++){
    confetti.push({
      x:STAGE_W/2+(Math.random()-.5)*60, y:STAGE_H*0.42,
      vx:(Math.random()-.5)*9, vy:-Math.random()*11-3,
      g:0.22+Math.random()*0.1, w:5+Math.random()*6, h:8+Math.random()*8,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*0.4,
      color:cols[(Math.random()*cols.length)|0], life:1
    });
  }
}
let dust=[];
function initDust(){
  for(let i=0;i<20;i++) dust.push({
    x:Math.random()*STAGE_W,y:Math.random()*STAGE_H,
    vy:-(0.1+Math.random()*0.22),vx:(Math.random()-.5)*0.2,
    r:0.5+Math.random()*1.3,a:0.04+Math.random()*0.14,ph:Math.random()*6.28
  });
}
function fxLoop(){
  ctx.clearRect(0,0,STAGE_W,STAGE_H);
  for(const d of dust){
    d.ph+=0.02; d.y+=d.vy; d.x+=d.vx+Math.sin(d.ph)*0.15;
    if(d.y<-4){d.y=STAGE_H+4;d.x=Math.random()*STAGE_W;}
    ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(d.ph));
    ctx.fillStyle='#cfd6de';ctx.shadowBlur=4;ctx.shadowColor='#aeb8c4';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=p.grav; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.glow){ctx.shadowBlur=10;ctx.shadowColor=p.color;}else ctx.shadowBlur=0;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+0.4,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];
    c.vy+=c.g;c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;c.vx*=0.99;
    if(c.y>STAGE_H+30){confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    ctx.globalAlpha=1;ctx.fillStyle=c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(fxLoop);
}

function toast(text,color,x,y){
  const t=document.createElement('div');
  t.className='toast';t.textContent=text;t.style.color=color||'#7af0d9';
  const r=stage.getBoundingClientRect();
  t.style.left=(x/STAGE_W*r.width)+'px';
  t.style.top =(y/STAGE_H*r.height)+'px';
  t.style.transform='translate(-50%,0)';
  stage.appendChild(t);
  setTimeout(()=>t.remove(),1000);
}
function shakeStage(){ stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),360); }

/* =============================================================
 *  SVG helpers
 * ============================================================= */
function el(tag,attrs){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}
const COMMON_DEFS = `
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a4654"/><stop offset="0.5" stop-color="#2b3542"/><stop offset="1" stop-color="#1d2531"/>
  </linearGradient>
  <linearGradient id="busbar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a4654"/><stop offset="0.4" stop-color="#222b36"/><stop offset="1" stop-color="#161d27"/>
  </linearGradient>
  <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b5360"/><stop offset="1" stop-color="#363d48"/>
  </linearGradient>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2c3540"/><stop offset="0.5" stop-color="#232b35"/><stop offset="1" stop-color="#1a212b"/>
  </linearGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a424d"/><stop offset="1" stop-color="#262d37"/>
  </linearGradient>
  <linearGradient id="pillarGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a525e"/><stop offset="0.5" stop-color="#363e49"/><stop offset="1" stop-color="#272e38"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d7dde4"/><stop offset="0.5" stop-color="#8d97a3"/><stop offset="1" stop-color="#4b5560"/>
  </linearGradient>
  <linearGradient id="gnye" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3aa635"/><stop offset="0.5" stop-color="#ffd23a"/><stop offset="1" stop-color="#3aa635"/>
  </linearGradient>
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
  </filter>`;
function addDefs(svg){ const d=el('defs',{}); d.innerHTML=COMMON_DEFS; svg.appendChild(d); }

function addCeiling(svg){
  svg.appendChild(el('rect',{x:0,y:0,width:390,height:120,fill:'url(#concrete)'}));
  svg.appendChild(el('line',{x1:0,y1:120,x2:390,y2:120,stroke:'#222a33','stroke-width':3}));
  for(let i=0;i<7;i++){
    svg.appendChild(el('circle',{cx:30+i*55,cy:26+(i%2)*14,r:2.4,fill:'rgba(0,0,0,.25)'}));
  }
  // Deckenleuchten-Streifen (dekorativ)
  [110,280].forEach(cx=>{
    svg.appendChild(el('rect',{x:cx-26,y:104,width:52,height:7,rx:2,fill:'#e9f3f0',opacity:0.55}));
  });
}

/* =============================================================
 *  GAME STATE + XP
 * ============================================================= */
const XP_MAX = 100000;
let xp=0;
let xpTarget=0;
let _xpAnimRunning=false;
const xpVal=document.getElementById('xpVal');
function addXp(n){
  n = Math.round((Number(n)||0)*0.5); // XP global -50% (Roadmap)
  xpTarget = Math.max(0, Math.min(XP_MAX, xpTarget + n));
  if(_xpAnimRunning) return;
  _xpAnimRunning=true;
  let from=xp, t0=performance.now();
  (function anim(t){
    const k=Math.min(1,(t-t0)/450);
    xp=Math.round(from+(xpTarget-from)*(1-Math.pow(1-k,3)));
    xp=Math.max(0,Math.min(XP_MAX,xp));
    xpVal.textContent=xp;
    if(k<1 && xp!==xpTarget){ requestAnimationFrame(anim); }
    else { xp=xpTarget; xpVal.textContent=xp; _xpAnimRunning=false; }
  })(t0);
}

function setHud(step){
  const chips=stepsBar.children;
  for(let i=0;i<chips.length;i++){

  }

const SCENE_OF = { lay:'pLay', tap:'pTap', load:'pLoad', fuse:'pFuse' };
function showScene(step){
  Object.values(SCENE_OF).forEach(id=>{
    const e=document.getElementById(id); e.classList.remove('on');
  });
  const tk=document.getElementById('task');
  tk.style.display=''; tk.style.opacity='';

  clearTimeout(window.__taskFadeT);
  if(window.__taskHidden){ tk.classList.add('hidden'); }
  else { tk.classList.remove('hidden'); window.__taskFadeT=setTimeout(()=>tk.classList.add('faded'),3500); }
  const cur=document.getElementById(SCENE_OF[step]);
  setTimeout(()=>cur.classList.add('on'),60);
}
function gotoStep(name){
  stepIdx=STEP_LIST.indexOf(name);

const svgLay=document.getElementById('svgLay');
const roLay=document.getElementById('roLay');
function buildLay(){
  svgLay.innerHTML=''; addDefs(svgLay);
  addCeiling(svgLay);
  addGarage(svgLay);
  // Einspeise-Verteiler unten links als visueller Anker
  drawFeedCabinet(svgLay);
  // ghost route
  svgLay.appendChild(el('rect',{x:BUS_X0,y:BUS_Y,width:BUS_X1-BUS_X0,height:18,rx:4,fill:'none',stroke:'#ffd166','stroke-width':1.6,'stroke-dasharray':'7 6',opacity:0.5}));

  // feed box
  svgLay.appendChild(el('rect',{x:BUS_X0-6,y:BUS_Y-6,width:16,height:30,rx:3,fill:'url(#steel)',stroke:'#2a3340','stroke-width':1}));

  const SEGW=(BUS_X1-BUS_X0)/4;
  let laid=0;
  const segs=[0,1,2,3];
  roLay.classList.remove('good');
  roLay.innerHTML='Schiene verlegen: <span class="big">0/4</span>';
  showDoHint('hintLay','<b>Etappe 1:</b> Flachband / Stromschiene Segment fuer Segment an die Decke clipsen. Tippe die markierten Stuecke.',4800);

  segs.forEach((s)=>{
    const sx=BUS_X0+s*SEGW;
    const g=el('g',{cursor:'pointer'});
    const ghost=el('rect',{x:sx+2,y:BUS_Y+2,width:SEGW-4,height:14,rx:3,fill:'rgba(120,135,150,.16)',stroke:'#7e8ea0','stroke-width':1,'stroke-dasharray':'4 4',class:'pulseTool'});
    g.appendChild(ghost);
    const hit=el('rect',{x:sx,y:BUS_Y-12,width:SEGW,height:44,fill:'transparent'});
    g.appendChild(hit);
    svgLay.appendChild(g);
    let done=false;
    hit.addEventListener('pointerdown',()=>{
      if(done) return; done=true; AC(); sndSnap();
      g.removeChild(ghost);
      const t=el('g',{filter:'url(#ds)'});
      t.appendChild(el('rect',{x:sx+1,y:BUS_Y,width:SEGW-2,height:18,rx:3,fill:'url(#busbar)',stroke:'#11161d','stroke-width':1.2}));

      t.appendChild(el('rect',{x:sx+SEGW/2-4,y:BUS_Y-14,width:8,height:14,fill:'url(#steel)'}));

        roLay.classList.add('good'); roLay.textContent='Trasse durchgehend, Einspeisung links angeschlossen';
        hideDoHint('hintLay');
        spark(195,BUS_Y,20,{color:'#2dd4bf',speed:4,up:1});
        setTimeout(()=>nextStep(),900);
      }
    });
  });
}

const svgLoad=document.getElementById('svgLoad');
const roLoad=document.getElementById('roLoad');
function buildLoad(){
  svgLoad.innerHTML=''; addDefs(svgLoad);
  addCeiling(svgLoad);
  addGarage(svgLoad);
  drawFeedCabinet(svgLoad);
  drawBus(svgLoad,{});
  // redraw taps (done)
  TAPS.forEach(tp=>{
    svgLoad.appendChild(el('rect',{x:tp.x-12,y:BUS_Y+18,width:24,height:22,rx:4,fill:'url(#metal)',stroke:'#11161d','stroke-width':1}));
    svgLoad.appendChild(el('circle',{cx:tp.x,cy:BUS_Y+29,r:3,fill:'#3aff8f'}));
  });

  // draw devices on the floor area
  const devY=600;
  TAPS.forEach(tp=>{ drawDevice(svgLoad,tp,devY); });

  let wired=0;
  roLoad.classList.remove('good');
  roLoad.innerHTML='Anschliessen: <span class="big">0/'+TAPS.length+'</span>';
  showDoHint('hintLoad','<b>Etappe 3:</b> Tippe ein Geraet — es wird an den Abgriff darueber angeschlossen. Ladestationen + Garagentor.',4800);

  TAPS.forEach(tp=>{
    const hit=el('rect',{x:tp.x-24,y:devY-6,width:48,height:64,fill:'transparent',cursor:'pointer'});
    svgLoad.appendChild(hit);
    const ring=el('rect',{x:tp.x-22,y:devY-4,width:44,height:58,rx:8,fill:'none',stroke:'#ffd166','stroke-width':2,class:'pulseTool'});
    svgLoad.appendChild(ring);
    let done=false;
    hit.addEventListener('pointerdown',()=>{
      if(done) return; done=true; AC(); sndPick();
      ring.remove();
      // connection cable tap -> device
      const path=el('path',{d:'M '+tp.x+' '+(BUS_Y+40)+' L '+tp.x+' '+devY,fill:'none',stroke:'#1c2530','stroke-width':5,'stroke-linecap':'round'});
      svgLoad.appendChild(path);
      const len=path.getTotalLength();
      path.setAttribute('stroke-dasharray',len); path.setAttribute('stroke-dashoffset',len);
      let t0=performance.now();
      (function a(t){
        const k=Math.min(1,(t-t0)/500);
        path.setAttribute('stroke-dashoffset',len*(1-k));
        if(k<1) requestAnimationFrame(a);
        else {
          sndSnap(); spark(tp.x,devY,8,{color:'#7af0d9',speed:2});
          wired++; addXp(8);
          toast(tp.kind==='ev'?'Ladepunkt angeschlossen':'Tor-Antrieb angeschlossen','#7af0d9',tp.x,devY-12);
          roLoad.innerHTML='Anschliessen: <span class="big">'+wired+'/'+TAPS.length+'</span>';
          if(wired===TAPS.length){
            roLoad.classList.add('good'); roLoad.textContent='Alle Verbraucher angeschlossen';
            hideDoHint('hintLoad');
            setTimeout(()=>nextStep(),900);
          }
        }
      })(performance.now());
    });
  });
}

  // Speiseleitung von der Trasse (Decke) in den Schrank
  svgFuse.appendChild(el('rect',{x:BUS_X0,y:BUS_Y,width:BUS_X1-BUS_X0,height:14,rx:4,fill:'url(#busbar)',stroke:'#11161d','stroke-width':1.2,opacity:0.9}));
  svgFuse.appendChild(el('path',{d:'M 195 '+(BUS_Y+14)+' L 195 200',fill:'none',stroke:'#1c2530','stroke-width':6,'stroke-linecap':'round'}));
  // UV-Schrank: Korpus mit Tuer + Scharnier
  const cab=el('g',{filter:'url(#ds)'});
  cab.appendChild(el('rect',{x:40,y:200,width:310,height:300,rx:12,fill:'url(#metal)',stroke:'#11161d','stroke-width':2}));
  cab.appendChild(el('rect',{x:48,y:208,width:294,height:284,rx:8,fill:'#10161e',stroke:'#2a3340','stroke-width':1}));
  // offene Tuer links angedeutet (Scharniere)
  cab.appendChild(el('rect',{x:34,y:212,width:8,height:276,rx:3,fill:'url(#steel)',stroke:'#11161d','stroke-width':1}));
  [230,360,460].forEach(cy=>cab.appendChild(el('circle',{cx:38,cy:cy,r:3,fill:'#5a6675'})));
  // Sockel am Boden
  cab.appendChild(el('rect',{x:54,y:500,width:282,height:14,rx:3,fill:'url(#metal)',stroke:'#11161d','stroke-width':1}));
  svgFuse.appendChild(cab);
  svgFuse.appendChild(el('text',{x:195,y:228,'text-anchor':'middle','font-size':'12','font-weight':'800',fill:'#fff'})).textContent='Unterverteilung Tiefgarage';
  // DIN rails (zwei Reihen)
  svgFuse.appendChild(el('rect',{x:60,y:250,width:270,height:8,rx:2,fill:'#3a4654'}));
  svgFuse.appendChild(el('rect',{x:60,y:336,width:270,height:8,rx:2,fill:'#3a4654',opacity:0.7}));

  // Each EV charger needs FI Typ B (or RCD + RDC-DD), gate needs LS only.
  const slots=[
    {x:90,  name:'Ladest.1', need:'fib'},
    {x:150, name:'Ladest.2', need:'fib'},
    {x:210, name:'Ladest.3', need:'fib'},
    {x:285, name:'Tor',      need:'ls'}
  ];
  const protos=[
    {id:'fib', label:'FI Typ B', color:'#2dd4bf'},
    {id:'ls',  label:'LS B16',   color:'#ffd166'}
  ];
  let selected=null, placed=0;

  roFuse.classList.remove('good');
  roFuse.innerHTML='Absichern: <span class="big">0/'+slots.length+'</span>';
  showDoHint('hintFuse','<b>Etappe 4:</b> Ladestationen brauchen <b>FI Typ B</b>, das Tor reicht ein <b>LS</b>. Schutz waehlen, dann Slot tippen.',5600);

  // selectable protections at bottom
  protos.forEach((p,i)=>{
    const px=120+i*150;
    const g=el('g',{cursor:'pointer'});
    g.appendChild(el('rect',{x:px-44,y:540,width:88,height:40,rx:8,fill:'#202a37',stroke:p.color,'stroke-width':1.6}));
    g.appendChild(el('text',{x:px,y:565,'text-anchor':'middle','font-size':'12','font-weight':'800',fill:p.color})).textContent=p.label;
    const ring=el('rect',{x:px-47,y:537,width:94,height:46,rx:10,fill:'none',stroke:'#fff','stroke-width':2,opacity:0});
    g.appendChild(ring);
    const hit=el('rect',{x:px-47,y:537,width:94,height:46,fill:'transparent'});
    g.appendChild(hit);
    svgFuse.appendChild(g);
    p._ring=ring;
    hit.addEventListener('pointerdown',()=>{
      protos.forEach(o=>o._ring.setAttribute('opacity','0'));
      selected=p; ring.setAttribute('opacity','1'); sndPick();
      showDoHint('hintFuse','<b>'+p.label+'</b> gewaehlt. Jetzt den passenden Stromkreis-Slot tippen.',2600);
    });
  });

  slots.forEach(sl=>{
    const g=el('g',{cursor:'pointer'});
    g.appendChild(el('rect',{x:sl.x-20,y:266,width:40,height:60,rx:5,fill:'#16202b',stroke:'#7e8ea0','stroke-width':1.6}));
    g.appendChild(el('text',{x:sl.x,y:346,'text-anchor':'middle','font-size':'8','font-weight':'700',fill:'#9fb0c0'})).textContent=sl.name;
    const hit=el('rect',{x:sl.x-22,y:264,width:44,height:64,fill:'transparent'});
    g.appendChild(hit);
    svgFuse.appendChild(g);
    sl._box=g.firstChild;
    let done=false;
    hit.addEventListener('pointerdown',()=>{
      if(done) return;
      if(!selected){ toast('Erst Schutz waehlen','#ffd166',sl.x,260); return; }
      if(selected.id===sl.need){
        done=true; AC(); sndSnap();
        sl._box.setAttribute('fill','#1c3a32');
        sl._box.setAttribute('stroke',selected.color);
        svgFuse.appendChild(el('text',{x:sl.x,y:300,'text-anchor':'middle','font-size':'9','font-weight':'800',fill:selected.color})).textContent=selected.id==='fib'?'B':'LS';
        spark(sl.x,290,8,{color:selected.color,speed:2});
        placed++; addXp(9);
        roFuse.innerHTML='Absichern: <span class="big">'+placed+'/'+slots.length+'</span>';
        if(placed===slots.length){
          roFuse.classList.remove('good');
          roFuse.textContent='Schutz gesetzt. Jetzt einschalten + pruefen.';
          showDoHint('hintFuse','<b>Funktionstest:</b> Tippe den gruenen Pruefknopf, um Spannung freizugeben.',4000);
          showTestButton();
        }
      } else {
        sndBad(); shakeStage();
        sl._box.setAttribute('stroke','#ff6b6b');
        setTimeout(()=>sl._box.setAttribute('stroke','#7e8ea0'),500);
        toast('Falscher Schutz!','#ff9b9b',sl.x,260);
        showDoHint('hintFuse','<b>Falsch:</b> Ladestation = FI Typ B (Gleichfehlerstrom!), Tor = LS.',2800);
      }
    });
  });

  function showTestButton(){
    const bx=195, by=440;
    const g=el('g',{cursor:'pointer'});
    g.appendChild(el('circle',{cx:bx,cy:by,r:24,fill:'#1c3a32',stroke:'#3aff8f','stroke-width':2.5,class:'pulseTool'}));
    g.appendChild(el('text',{x:bx,y:by+4,'text-anchor':'middle','font-size':'10','font-weight':'800',fill:'#7af0d9'})).textContent='TEST';
    const hit=el('circle',{cx:bx,cy:by,r:30,fill:'transparent'});
    g.appendChild(hit);
    svgFuse.appendChild(g);
    hit.addEventListener('pointerdown',()=>{
      AC(); sndPower();
      g.firstChild.classList.remove('pulseTool');
      g.firstChild.setAttribute('fill','#3aff8f');
      spark(bx,by,26,{color:'#3aff8f',speed:4,up:1});
      roFuse.classList.add('good'); roFuse.textContent='FI ausgeloest + ok, Ladepunkte + Tor unter Spannung';
      hideDoHint('hintFuse');
      setTimeout(()=>triggerWin(),800);
    });
  }
}

/* =============================================================
 *  WIN
 * ============================================================= */
function triggerWin(){
  document.getElementById('progFill').style.width='100%';
  sndWin(); burstConfetti();
  spark(STAGE_W/2,STAGE_H*0.4,40,{color:'#ffd166',speed:6,up:2});
  setTimeout(()=>{
    const win=document.getElementById('win'); win.classList.add('show');
    addXp(40);
    const sts=document.querySelectorAll('#stars .st');
    sts.forEach((s,i)=>setTimeout(()=>{s.classList.add('lit');sndSnap();},300+i*260));
    const xb=document.getElementById('xpBig'); let v=0; const tt=performance.now();
    (function cc(t){const k=Math.min(1,(t-tt)/900);v=Math.round(110*(1-Math.pow(1-k,3)));xb.textContent='+'+v+' XP';if(k<1)requestAnimationFrame(cc);})(performance.now());
  },650);
}
document.getElementById('again').onclick=()=>location.reload();

/* =============================================================
 *  BUILDERS registry + boot
 * ============================================================= */
const BUILDERS = {
  lay: buildLay,
  tap: buildTap,
  load:buildLoad,
  fuse:buildFuse
};

function boot(){
  sizeCanvas();
  initDust();
  buildStepsBar();
  fxLoop();
  gotoStep('lay');
}
window.addEventListener('resize',sizeCanvas);

/* ---- Aufgaben-Box ein-/ausklappbar (verdeckt sonst die Spielflaeche) ---- */
window.__taskHidden=false;
(function(){
  const tt=document.getElementById('taskToggle');
  const tk=document.getElementById('task');
  if(!tt||!tk) return;
  function apply(){
    if(window.__taskHidden){
      clearTimeout(window.__taskFadeT);
      tk.classList.add('hidden'); tk.classList.remove('faded');
      tt.textContent='Aufgabe einblenden';
    } else {
      tk.classList.remove('hidden','faded');
      tt.textContent='Aufgabe ausblenden';
      clearTimeout(window.__taskFadeT);
      window.__taskFadeT=setTimeout(()=>tk.classList.add('faded'),3500);
    }
  }
  tt.addEventListener('click',()=>{ window.__taskHidden=!window.__taskHidden; apply(); });
  tt.addEventListener('pointerenter',()=>{ if(!window.__taskHidden){ tk.classList.remove('faded'); } });
})();

boot();

})();
