<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LernStrom — Kabeltrasse in der Tiefgarage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:radial-gradient(circle at 50% 30%, #1a2230 0%, #0c1018 70%, #06080d 100%);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#e8edf2;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #stage{
    position:relative;
    width:390px;height:844px;
    max-height:100vh;
    border-radius:34px;
    overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.7), 0 0 0 10px #0a0d13, 0 0 0 12px #1c232e, inset 0 0 60px rgba(0,0,0,.4);
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(45,212,191,.08), transparent 60%),
      linear-gradient(180deg,#3a4250 0%, #2a323e 30%, #20262f 70%, #171c24 100%);
  }
  @media (max-height:860px){ #stage{transform:scale(calc(100vh / 860));} }

  /* concrete garage vignette */
  #stage::after{
    content:"";position:absolute;inset:0;border-radius:34px;pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.55), inset 0 -40px 80px rgba(0,0,0,.5);
    background:radial-gradient(140% 90% at 50% 120%, rgba(70,80,95,.14), transparent 55%);
    z-index:60;
  }

  canvas#fx{position:absolute;inset:0;z-index:40;pointer-events:none;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:50;padding:14px 16px 8px;display:flex;align-items:center;gap:10px;}
  .badge{
    display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;
    box-shadow:0 4px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .badge .dot{width:9px;height:9px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf;}
  #xpBadge{color:#ffd166;}
  #xpBadge .ico{display:inline-block;width:13px;height:13px;
    background:#ffd166;clip-path:polygon(58% 0,0 60%,42% 60%,42% 100%,100% 40%,58% 40%);
    filter:drop-shadow(0 0 5px rgba(255,209,102,.6));}
  .spacer{flex:1;}
  #mute{
    width:38px;height:38px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#202a37,#161d27);
    border:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
  }
  #mute svg{width:18px;height:18px;}
  #mute:active{transform:scale(.92);}

  /* step progress bar */
  #prog{position:absolute;top:58px;left:16px;right:16px;z-index:50;height:8px;border-radius:6px;
    background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  #progFill{height:100%;width:0%;border-radius:6px;
    background:linear-gradient(90deg,#2dd4bf,#7af0d9);transition:width .5s cubic-bezier(.2,1.3,.4,1);
    box-shadow:0 0 12px rgba(45,212,191,.7);}

  /* step chips row */
  #steps{position:absolute;top:38px;left:16px;right:16px;z-index:49;display:flex;gap:4px;justify-content:center;pointer-events:none;}
  #steps .sc{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.08);transition:background .4s, box-shadow .4s;}
  #steps .sc.done{background:linear-gradient(90deg,#2dd4bf,#7af0d9);box-shadow:0 0 8px rgba(45,212,191,.6);}
  #steps .sc.cur{background:#ffd166;box-shadow:0 0 10px rgba(255,209,102,.7);}

  /* ---------- title / instruction ---------- */
  #task{position:absolute;top:74px;left:0;right:0;z-index:50;text-align:center;pointer-events:none;padding:0 14px;transition:opacity .6s, transform .6s;}
  #task.faded{opacity:0;transform:translateY(-8px);pointer-events:none;}
  #task.hidden{opacity:0!important;transform:translateY(-8px);pointer-events:none!important;}
  #task h1{font-size:15px;font-weight:800;letter-spacing:.3px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  #task p{font-size:12px;margin-top:3px;color:#9fb0c0;font-weight:600;line-height:1.4;}
  #taskToggle{position:absolute;top:96px;right:12px;z-index:58;cursor:pointer;
    font-size:10px;font-weight:800;color:#9fb0c0;background:rgba(10,14,20,.55);
    border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:4px 9px;
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);user-select:none;-webkit-user-select:none;}
  #taskToggle:active{transform:scale(.94);}

  /* generic scene container */
  .prep{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;transition:opacity .55s;}
  .prep.on{opacity:1;pointer-events:auto;}
  .prep svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

  /* tool / measurement readout chip */
  .readout{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;z-index:35;
    font-size:13px;font-weight:800;color:#fff;background:linear-gradient(180deg,#202a37,#141a23);
    padding:7px 16px;border-radius:20px;border:1px solid rgba(45,212,191,.3);
    box-shadow:0 6px 18px rgba(0,0,0,.5);pointer-events:none;text-align:center;min-width:180px;}
  .readout .big{color:#7af0d9;font-size:16px;}
  .readout.bad{border-color:#ff6b6b;color:#ffb3b3;}
  .readout.good{border-color:#2dd4bf;}

  /* big floating "do this" hint banner */
  .doHint{position:absolute;left:12px;top:120px;z-index:36;max-width:180px;
    font-size:11.5px;font-weight:800;color:#fff;text-align:left;line-height:1.4;
    background:linear-gradient(180deg,rgba(32,42,55,.95),rgba(20,26,35,.95));
    padding:9px 16px;border-radius:16px;border:1px solid rgba(45,212,191,.4);
    box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 22px rgba(45,212,191,.18);
    pointer-events:none;opacity:0;transition:opacity .4s;}
  .doHint.on{opacity:1;}
  .doHint b{color:#7af0d9;}

  .toast{position:absolute;z-index:55;font-weight:900;font-size:15px;pointer-events:none;
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:toastUp 1s ease-out forwards;}
  @keyframes toastUp{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-6px) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}

  .shake{animation:shakeStage .35s;}
  @keyframes shakeStage{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,-1px)}}

  .pulseTool{animation:toolPulse 1.1s ease-in-out infinite;}
  @keyframes toolPulse{0%,100%{filter:drop-shadow(0 0 1px rgba(45,212,191,.3))}50%{filter:drop-shadow(0 0 10px rgba(45,212,191,.95)) drop-shadow(0 0 4px rgba(122,240,217,.9))}}

  /* WIN overlay */
  #win{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(45,212,191,.18), rgba(6,9,14,.86) 60%);
    backdrop-filter:blur(2px);}
  #win.show{display:flex;animation:winIn .5s;}
  @keyframes winIn{from{opacity:0}to{opacity:1}}
  #win .card{
    width:300px;padding:26px 22px 24px;border-radius:24px;text-align:center;
    background:linear-gradient(180deg,#222d3a,#161d27);
    border:1px solid rgba(45,212,191,.3);
    box-shadow:0 30px 70px rgba(0,0,0,.7), 0 0 40px rgba(45,212,191,.2), inset 0 1px 0 rgba(255,255,255,.06);
    transform:scale(.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards;
  }
  @keyframes pop{to{transform:scale(1)}}
  #win h2{font-size:22px;font-weight:900;color:#fff;letter-spacing:.5px;}
  #win .sub{font-size:13px;color:#9fb0c0;margin-top:5px;font-weight:600;}
  #stars{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;}
  #stars .st{font-size:34px;color:#2a3340;transform:scale(0);line-height:1;}
  #stars .st.lit{color:#ffd166;text-shadow:0 0 16px rgba(255,209,102,.8);animation:starPop .5s cubic-bezier(.2,1.8,.4,1) forwards;}
  @keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
  #xpBig{font-size:30px;font-weight:900;color:#ffd166;margin:8px 0 4px;text-shadow:0 0 18px rgba(255,209,102,.5);}
  #win .ok{margin-top:16px;padding:12px 0;border-radius:14px;cursor:pointer;font-weight:800;font-size:15px;color:#06281f;
    background:linear-gradient(180deg,#5cf0d6,#2dd4bf);box-shadow:0 8px 20px rgba(45,212,191,.4);}
  #win .ok:active{transform:scale(.96);}
</style>
</head>
<body>
<div id="stage">

  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="badge"><span class="dot"></span><span id="phaseLbl">Schritt 1</span></div>
    <div class="spacer"></div>
    <div class="badge" id="xpBadge"><span class="ico"></span><span id="xpVal">0</span> XP</div>
    <div id="mute"></div>
  </div>

  <div id="steps"></div>
  <div id="prog"><div id="progFill"></div></div>

  <div id="task">
    <h1 id="taskTitle">Kabeltrasse installieren</h1>
    <p id="taskSub">Tiefgarage MFH — nach NIN 2025</p>
  </div>
  <div id="taskToggle">Aufgabe ausblenden</div>

  <!-- SCENES -->
  <div class="prep" id="pConsole"><svg id="svgConsole" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintConsole"></div><div class="readout" id="roConsole">Konsolen setzen (0/4)</div></div>
  <div class="prep" id="pTray"><svg id="svgTray" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintTray"></div><div class="readout" id="roTray">Rinnen verlegen</div></div>
  <div class="prep" id="pCable"><svg id="svgCable" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintCable"></div><div class="readout" id="roCable">Kabel einlegen (0/4)</div></div>
  <div class="prep" id="pCheck"><svg id="svgCheck" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice"></svg><div class="doHint" id="hintCheck"></div><div class="readout" id="roCheck">Kontroll-Check</div></div>

  <!-- WIN -->
  <div id="win">
    <div class="card">
      <h2>TRASSE FERTIG!</h2>
      <div class="sub">Kabeltrasse fachgerecht installiert</div>
      <div id="stars"><span class="st">&#9733;</span><span class="st">&#9733;</span><span class="st">&#9733;</span></div>
      <div id="xpBig">+0 XP</div>
      <div class="sub" id="winNote">Konsolen &middot; Trasse geerdet &middot; Kabel fixiert</div>
      <div class="ok" id="again">Nochmal spielen</div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";
/* ============================================================= *
 *  LernStrom — Kabeltrasse in der Tiefgarage (single-file)      *
 *  CH / NIN 2025: Konsolen, Trasse verlegen + erden,            *
 *  Kabel einlegen + befestigen, Kontroll-Check.                 *
 *  Pure SVG + Canvas FX + WebAudio. Keine Emojis (SVG/CSS).     *
 * ============================================================= */

const STAGE_W = 390, STAGE_H = 844;
const SVGNS   = "http://www.w3.org/2000/svg";
const stage   = document.getElementById('stage');
const fx      = document.getElementById('fx');
const ctx     = fx.getContext('2d');

function toSvgFor(svg, clientX, clientY){
  const r = svg.getBoundingClientRect();
  return {
    x: (clientX - r.left) / r.width  * STAGE_W,
    y: (clientY - r.top ) / r.height * STAGE_H
  };
}

/* =============================================================
 *  AUDIO
 * ============================================================= */
let audioCtx=null, muted=true;
function AC(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return audioCtx; }
function tone(freq, dur, type, vol, slideTo){
  if(muted) return; const c=AC(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime+dur);
  g.gain.value=0.0001;
  g.gain.exponentialRampToValueAtTime(vol||0.2, c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+dur);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime+dur+0.02);
}
function sndClick(){ tone(680,0.07,'triangle',0.25,1200); setTimeout(()=>tone(1500,0.05,'sine',0.12),20); }
function sndSnap(){ tone(440,0.05,'square',0.18,900); setTimeout(()=>tone(1320,0.12,'triangle',0.22),30); }
function sndDrill(){ if(muted)return; const c=AC(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sawtooth';o.frequency.value=140;
  o.frequency.linearRampToValueAtTime(220,c.currentTime+0.3);
  g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.16,c.currentTime+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.34);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.36);
}
function sndBuzz(){ if(muted)return; const c=AC(); if(!c)return;
  const o=c.createOscillator(),g=c.createGain(); o.type='sawtooth';o.frequency.value=120;
  g.gain.value=0.0001;g.gain.exponentialRampToValueAtTime(0.22,c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+0.25);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.27);
}
function sndPick(){ tone(520,0.05,'sine',0.14,720); }
function sndWin(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,0.3,'triangle',0.2),i*110)); }

const muteBtn=document.getElementById('mute');
const ICON_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="#9fb0c0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="#9fb0c0"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/></svg>';
const ICON_SND='<svg viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z" fill="#2dd4bf"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
muteBtn.innerHTML=ICON_MUTE;
muteBtn.onclick=function(){
  muted=!muted; this.innerHTML=muted?ICON_MUTE:ICON_SND;
  if(!muted){ AC(); tone(880,0.06,'sine',0.15); }
};

/* =============================================================
 *  PARTICLE / FX ENGINE
 * ============================================================= */
function sizeCanvas(){
  const r=stage.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  fx.width=STAGE_W*dpr; fx.height=STAGE_H*dpr;
  fx.style.width=r.width+'px'; fx.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
let particles=[];
function spark(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(opt.speed||3)*(0.4+Math.random());
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (opt.up||0),
      life:1, decay:0.012+Math.random()*0.02,
      size:(opt.size||2.4)*(0.6+Math.random()),
      color:opt.color|| (Math.random()<.5?'#ffd166':'#cfd6de'),
      grav:opt.grav!=null?opt.grav:0.06, glow:opt.glow!==false
    });
  }
}
let confetti=[];
function burstConfetti(){
  const cols=['#2dd4bf','#ffd166','#ff6b6b','#7af0d9','#ffffff','#9aa0a6','#8ab4ff'];
  for(let i=0;i<140;i++){
    confetti.push({
      x:STAGE_W/2+(Math.random()-.5)*60, y:STAGE_H*0.42,
      vx:(Math.random()-.5)*9, vy:-Math.random()*11-3,
      g:0.22+Math.random()*0.1, w:5+Math.random()*6, h:8+Math.random()*8,
      rot:Math.random()*6.28, vr:(Math.random()-.5)*0.4,
      color:cols[(Math.random()*cols.length)|0], life:1
    });
  }
}
let dust=[];
function initDust(){
  for(let i=0;i<20;i++) dust.push({
    x:Math.random()*STAGE_W,y:Math.random()*STAGE_H,
    vy:-(0.1+Math.random()*0.22),vx:(Math.random()-.5)*0.2,
    r:0.5+Math.random()*1.3,a:0.04+Math.random()*0.14,ph:Math.random()*6.28
  });
}
function fxLoop(){
  ctx.clearRect(0,0,STAGE_W,STAGE_H);
  for(const d of dust){
    d.ph+=0.02; d.y+=d.vy; d.x+=d.vx+Math.sin(d.ph)*0.15;
    if(d.y<-4){d.y=STAGE_H+4;d.x=Math.random()*STAGE_W;}
    ctx.globalAlpha=d.a*(0.6+0.4*Math.sin(d.ph));
    ctx.fillStyle='#cfd6de';ctx.shadowBlur=4;ctx.shadowColor='#aeb8c4';
    ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=p.grav; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=Math.max(0,p.life);
    if(p.glow){ctx.shadowBlur=10;ctx.shadowColor=p.color;}else ctx.shadowBlur=0;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life+0.4,0,6.28);ctx.fill();
  }
  ctx.shadowBlur=0;
  for(let i=confetti.length-1;i>=0;i--){
    const c=confetti[i];
    c.vy+=c.g;c.x+=c.vx;c.y+=c.vy;c.rot+=c.vr;c.vx*=0.99;
    if(c.y>STAGE_H+30){confetti.splice(i,1);continue;}
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);
    ctx.globalAlpha=1;ctx.fillStyle=c.color;
    ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(fxLoop);
}

function toast(text,color,x,y){
  const t=document.createElement('div');
  t.className='toast';t.textContent=text;t.style.color=color||'#7af0d9';
  const r=stage.getBoundingClientRect();
  t.style.left=(x/STAGE_W*r.width)+'px';
  t.style.top =(y/STAGE_H*r.height)+'px';
  t.style.transform='translate(-50%,0)';
  stage.appendChild(t);
  setTimeout(()=>t.remove(),1000);
}
function shakeStage(){ stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),360); }

/* =============================================================
 *  SVG helpers
 * ============================================================= */
function el(tag,attrs){
  const e=document.createElementNS(SVGNS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}
const COMMON_DEFS = `
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3a4654"/><stop offset="0.5" stop-color="#2b3542"/><stop offset="1" stop-color="#1d2531"/>
  </linearGradient>
  <linearGradient id="galv" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e3e8ee"/><stop offset="0.45" stop-color="#aab3bf"/><stop offset="0.55" stop-color="#c7cdd6"/><stop offset="1" stop-color="#7e8896"/>
  </linearGradient>
  <linearGradient id="galvSide" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9aa3b0"/><stop offset="1" stop-color="#5c6573"/>
  </linearGradient>
  <linearGradient id="concrete" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4b5360"/><stop offset="1" stop-color="#363d48"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#d7dde4"/><stop offset="0.5" stop-color="#8d97a3"/><stop offset="1" stop-color="#4b5560"/>
  </linearGradient>
  <linearGradient id="gnye" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3aa635"/><stop offset="0.5" stop-color="#ffd23a"/><stop offset="1" stop-color="#3aa635"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3b424d"/><stop offset="0.5" stop-color="#2c333d"/><stop offset="1" stop-color="#1c222a"/>
  </linearGradient>
  <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="14" height="14" fill="none"/>
    <rect width="7" height="14" fill="rgba(0,0,0,.55)"/>

/* =============================================================
 *  GAME STATE + XP
 * ============================================================= */
const XP_MAX = 100000;
let xp=0;
let xpTarget=0;
let _xpAnimRunning=false;
const xpVal=document.getElementById('xpVal');
function addXp(n){
  n = Math.round((Number(n)||0)*0.5); // XP global -50% (Roadmap)
  xpTarget = Math.max(0, Math.min(XP_MAX, xpTarget + n));
  if(_xpAnimRunning) return;
  _xpAnimRunning=true;
  let from=xp, t0=performance.now();
  (function anim(t){
    const k=Math.min(1,(t-t0)/450);
    xp=Math.round(from+(xpTarget-from)*(1-Math.pow(1-k,3)));
    xp=Math.max(0,Math.min(XP_MAX,xp));
    xpVal.textContent=xp;
    if(k<1 && xp!==xpTarget){ requestAnimationFrame(anim); }
    else { xp=xpTarget; xpVal.textContent=xp; _xpAnimRunning=false; }
  })(t0);
}

/* =============================================================
 *  STEP orchestration

const STEP_LIST = ['console','tray','cable','check'];
const STEP_TITLES = {
  console:['Konsolen montieren','Setze die Trager an der Decke (richtige Abstande)'],
  tray:   ['Trasse verlegen + erden','Rinnen verbinden, Bogen, Deckel, Erdung gelb-grun'],
  cable:  ['Kabel einlegen','Kabel sauber einlegen, Biegeradius, Bindeschellen'],
  check:  ['Kontroll-Check','Pruefe Erdung, Befestigung und Abstande']
};
let stepIdx=0;
const stepsBar=document.getElementById('steps');
function buildStepsBar(){
  stepsBar.innerHTML='';
  STEP_LIST.forEach(()=>{ const d=document.createElement('div'); d.className='sc'; stepsBar.appendChild(d); });
}
function setHud(step){
  const chips=stepsBar.children;
  for(let i=0;i<chips.length;i++){
    chips[i].className='sc'+(i<stepIdx?' done':i===stepIdx?' cur':'');
  }
  document.getElementById('phaseLbl').textContent='Schritt '+(stepIdx+1)+'/'+STEP_LIST.length;
  const t=STEP_TITLES[step];
  document.getElementById('taskTitle').textContent=t[0];
  document.getElementById('taskSub').textContent=t[1];
  document.getElementById('progFill').style.width=(stepIdx/(STEP_LIST.length-1)*100)+'%';
}

const SCENE_OF = { console:'pConsole', tray:'pTray', cable:'pCable', check:'pCheck' };
function showScene(step){
  Object.values(SCENE_OF).forEach(id=>{
    const e=document.getElementById(id); e.classList.remove('on');
  });
  const tk=document.getElementById('task');
  tk.style.display=''; tk.style.opacity='';
  tk.classList.remove('faded');
  clearTimeout(window.__taskFadeT);
  if(window.__taskHidden){ tk.classList.add('hidden'); }
  else { tk.classList.remove('hidden'); window.__taskFadeT=setTimeout(()=>tk.classList.add('faded'),3500); }
  const cur=document.getElementById(SCENE_OF[step]);
  setTimeout(()=>cur.classList.add('on'),60);
}
function gotoStep(name){
  stepIdx=STEP_LIST.indexOf(name);
  setHud(name);
  showScene(name);
  BUILDERS[name]();
}
window.__goto=function(n){ try{gotoStep(n);}catch(e){console.log('goto err',e);} };
function nextStep(){
  const ni=stepIdx+1;
  if(ni>=STEP_LIST.length) return;
  gotoStep(STEP_LIST[ni]);
}

/* =============================================================
 *  ETAPPE 2 — Trasse (Rinne) verlegen + verbinden + erden

const svgTray=document.getElementById('svgTray');
const roTray=document.getElementById('roTray');
function buildTray(){
  svgTray.innerHTML=''; addDefs(svgTray);
  addCeiling(svgTray);
  addGarage(svgTray);
  // consoles already there (from etappe 1, redrawn), lowered into the room
  const lineY=320;

  pts.forEach(px=>{

    svgTray.appendChild(el('rect',{x:px-3,y:154,width:6,height:(lineY-154),rx:1.5,fill:'url(#steel)',stroke:'#2a3340','stroke-width':0.8,opacity:0.9}));

  let seated=0, earthed=false;
  const NEED_SEG=3;
  roTray.classList.remove('good');
  roTray.innerHTML='Rinnen einrasten: <span class="big">0/'+NEED_SEG+'</span>';
  showDoHint('hintTray','<b>Etappe 2:</b> Rinnen auf die Konsolen klicken, Stosse verbinden. Danach <b>Erdung gelb-grun</b> nicht vergessen!',4600);

  const segX=[40,140,240]; // 3 tray segments, each 100 wide
  const segs=[];
  segX.forEach((sx)=>{
    const g=el('g',{cursor:'pointer'});
    const ghost=el('rect',{x:sx+2,y:trayY-1,width:96,height:16,rx:2,fill:'rgba(120,135,150,.18)',stroke:'#7e8ea0','stroke-width':1,'stroke-dasharray':'4 4'});

    const hit=el('rect',{x:sx,y:trayY-14,width:100,height:42,fill:'transparent'});
    g.appendChild(hit);
    svgTray.appendChild(g);
    let done=false;
    hit.addEventListener('pointerdown',()=>{
      if(done) return; done=true; AC(); sndSnap();
      g.removeChild(ghost);
      // real galvanised tray segment (perforated cable tray look)
      const t=el('g',{filter:'url(#ds)'});
      t.appendChild(el('rect',{x:sx+1,y:trayY-2,width:98,height:18,rx:2,fill:'url(#galv)',stroke:'#5c6573','stroke-width':1}));
      // side rail
      t.appendChild(el('rect',{x:sx+1,y:trayY-2,width:98,height:4,fill:'url(#galvSide)'}));

      for(let h=0;h<6;h++) t.appendChild(el('rect',{x:sx+10+h*15,y:trayY+6,width:8,height:6,rx:1.5,fill:'rgba(0,0,0,.28)'}));

        showDoHint('hintTray','<b>Pflicht (NIN):</b> Trasse muss in den <b>Potenzialausgleich</b>. Tippe die gelb-grune Erdungslasche.',6000);

  function showEarthTarget(){

    const ex=320, ey=trayY+8;

    // lug
    g.appendChild(el('rect',{x:ex-4,y:trayY+2,width:8,height:10,rx:1.5,fill:'url(#steel)',stroke:'#2a3340','stroke-width':1}));

    hit.addEventListener('pointerdown',()=>{

      // bonding clamp
      svgTray.appendChild(el('rect',{x:ex-6,y:ey-6,width:12,height:12,rx:2,fill:'url(#steel)',stroke:'#1d2531','stroke-width':1}));
      spark(ex,ey,22,{color:'#3aff8f',speed:4,up:1});

      roTray.classList.add('good'); roTray.textContent='Potenzialausgleich angeschlossen, Deckel folgt nach Kabel';
      hideDoHint('hintTray');
      setTimeout(()=>nextStep(),1100);
    });
  }
}

    const dy=420+i*78;
    const g=el('g',{cursor:'pointer'});
    g.appendChild(el('circle',{cx:46,cy:dy,r:22,fill:'#2a3340',stroke:'#1d2531','stroke-width':2}));
    g.appendChild(el('circle',{cx:46,cy:dy,r:13,fill:col.c,stroke:col.hi,'stroke-width':3}));
    g.appendChild(el('circle',{cx:46,cy:dy,r:4,fill:'#11161d'}));
    g.appendChild(el('text',{x:80,y:dy+4,'font-size':'10','font-weight':'700',fill:'#cdd8e2'})).textContent=col.n;
    const ring=el('circle',{cx:46,cy:dy,r:26,fill:'none',stroke:'#ffd166','stroke-width':2,class:'pulseTool'});
    g.appendChild(ring);
    const hit=el('circle',{cx:46,cy:dy,r:30,fill:'transparent'});
    g.appendChild(hit);
    svgCable.appendChild(g);
    let done=false;
    const slotY=trayY+2+i*3.0; // stack cables neatly inside tray
    hit.addEventListener('pointerdown',()=>{
      if(done) return; done=true; AC(); sndPick();
      ring.classList.remove('pulseTool'); ring.setAttribute('opacity','0');
      // animate a cable being routed from drum into the tray with a nice bend
      const path=el('path',{
        d:'M 46 '+dy+' C 60 '+(dy-40)+' 60 '+(slotY+90)+' 100 '+slotY+' L 332 '+slotY,
        fill:'none',stroke:col.c,'stroke-width':5,'stroke-linecap':'round'});
      svgCable.appendChild(path);
      const len=path.getTotalLength();
      path.setAttribute('stroke-dasharray',len);
      path.setAttribute('stroke-dashoffset',len);
      let t0=performance.now();
      (function a(t){
        const k=Math.min(1,(t-t0)/650);
        path.setAttribute('stroke-dashoffset',len*(1-k));
        if(k<1) requestAnimationFrame(a);
        else {
          sndSnap();
          laid++;
          addXp(7);
          spark(332,slotY,8,{color:col.hi,speed:2});
          roCable.innerHTML='Kabel einlegen: <span class="big">'+laid+'/'+NEED_CABLES+'</span>';
          if(laid===NEED_CABLES){ finishCable(trayY); }
        }
      })(performance.now());
    });
  });

  function finishCable(trayY){
    // bindeschellen / cable ties at intervals + label
    [120,200,280].forEach(bx=>{
      svgCable.appendChild(el('rect',{x:bx-2,y:trayY-3,width:4,height:24,rx:2,fill:'#11161d'}));
      svgCable.appendChild(el('rect',{x:bx-6,y:trayY+18,width:12,height:5,rx:2,fill:'#0c1118'}));
    });
    // label tag
    svgCable.appendChild(el('rect',{x:150,y:trayY-30,width:90,height:16,rx:3,fill:'#f4f7fa',stroke:'#2a3340','stroke-width':1}));
    svgCable.appendChild(el('text',{x:195,y:trayY-18,'text-anchor':'middle','font-size':'9','font-weight':'800',fill:'#1d2531'})).textContent='TRASSE TG-01';
    toast('Kabel fixiert + beschriftet','#7af0d9',195,trayY-44);
    roCable.classList.add('good'); roCable.textContent='Kabel fixiert (Bindeschellen) + beschriftet';
    hideDoHint('hintCable');
    addXp(10);
    setTimeout(()=>nextStep(),1100);
  }
}

/* =============================================================
 *  ETAPPE 4 — Funktions-/Kontroll-Check
 *  Hake die 4 Prüfpunkte ab; alle gruen -> WIN.
 * ============================================================= */
const svgCheck=document.getElementById('svgCheck');
const roCheck=document.getElementById('roCheck');
function buildCheck(){
  svgCheck.innerHTML=''; addDefs(svgCheck);
  addCeiling(svgCheck);
  addGarage(svgCheck);
  // clipboard / tablet panel in front of the garage context
  svgCheck.appendChild(el('rect',{x:24,y:190,width:342,height:582,rx:20,fill:'rgba(10,14,20,.45)','stroke':'rgba(0,0,0,.4)','stroke-width':1}));
  svgCheck.appendChild(el('rect',{x:30,y:200,width:330,height:560,rx:18,fill:'rgba(16,22,30,.82)',stroke:'rgba(45,212,191,.25)','stroke-width':1.5}));
  // clipboard clamp at top
  svgCheck.appendChild(el('rect',{x:165,y:184,width:60,height:16,rx:5,fill:'url(#steel)',stroke:'#2a3340','stroke-width':1}));
  svgCheck.appendChild(el('text',{x:195,y:236,'text-anchor':'middle','font-size':'14','font-weight':'800',fill:'#fff'})).textContent='Kontroll-Check NIN';

  const items=[
    'Trasse geerdet (Potenzialausgleich)',
    'Konsolen-Abstande ok, waagrecht',
    'Kabel im Biegeradius, fixiert',
    'Beschriftung + Deckel montiert'
  ];
  let checked=0;
  roCheck.classList.remove('good');
  roCheck.innerHTML='Pruefpunkte: <span class="big">0/'+items.length+'</span>';
  showDoHint('hintCheck','<b>Etappe 4:</b> Tippe jeden Punkt an, um ihn abzuhaken.',3800);

  items.forEach((txt,i)=>{
    const yy=276+i*100;
    const g=el('g',{cursor:'pointer'});
    g.appendChild(el('rect',{x:54,y:yy,width:282,height:78,rx:12,fill:'rgba(34,45,58,.7)',stroke:'rgba(255,255,255,.07)','stroke-width':1}));
    const box=el('rect',{x:70,y:yy+24,width:30,height:30,rx:7,fill:'#16202b',stroke:'#7e8ea0','stroke-width':2});
    g.appendChild(box);
    const tick=el('path',{d:'M 76 '+(yy+39)+' l 7 8 l 13 -16',fill:'none',stroke:'#3aff8f','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0});
    g.appendChild(tick);
    const label=el('text',{x:116,y:yy+44,'font-size':'12','font-weight':'700',fill:'#cdd8e2'});
    // wrap long text in two lines if needed
    label.textContent=txt;
    g.appendChild(label);
    const hit=el('rect',{x:54,y:yy,width:282,height:78,fill:'transparent'});
    g.appendChild(hit);
    svgCheck.appendChild(g);
    let done=false;
    hit.addEventListener('pointerdown',()=>{
      if(done) return; done=true; AC(); sndSnap();
      box.setAttribute('stroke','#3aff8f');
      tick.setAttribute('opacity','1');
      label.setAttribute('fill','#fff');
      spark(85,yy+39,8,{color:'#3aff8f',speed:2});
      checked++;
      addXp(6);
      roCheck.innerHTML='Pruefpunkte: <span class="big">'+checked+'/'+items.length+'</span>';
      if(checked===items.length){
        roCheck.classList.add('good'); roCheck.textContent='Alles gepruft, Trasse betriebsbereit';
        hideDoHint('hintCheck');
        setTimeout(()=>triggerWin(),700);
      }
    });
  });
}

/* =============================================================
 *  WIN
 * ============================================================= */
function triggerWin(){
  document.getElementById('progFill').style.width='100%';
  sndWin(); burstConfetti();
  spark(STAGE_W/2,STAGE_H*0.4,40,{color:'#ffd166',speed:6,up:2});
  setTimeout(()=>{
    const win=document.getElementById('win'); win.classList.add('show');
    addXp(40);
    const sts=document.querySelectorAll('#stars .st');
    sts.forEach((s,i)=>setTimeout(()=>{s.classList.add('lit');sndSnap();},300+i*260));
    const xb=document.getElementById('xpBig'); let v=0; const tt=performance.now();
    (function cc(t){const k=Math.min(1,(t-tt)/900);v=Math.round(110*(1-Math.pow(1-k,3)));xb.textContent='+'+v+' XP';if(k<1)requestAnimationFrame(cc);})(performance.now());
  },650);
}
document.getElementById('again').onclick=()=>location.reload();

 *  BUILDERS registry + boot

const BUILDERS = {
  console:buildConsole,
  tray:   buildTray,
  cable:  buildCable,
  check:  buildCheck
};

function boot(){
  sizeCanvas();
  initDust();
  buildStepsBar();
  fxLoop();
  gotoStep('console');
}
window.addEventListener('resize',sizeCanvas);

/* ---- Aufgaben-Box ein-/ausklappbar (verdeckt sonst die Spielflaeche) ---- */
window.__taskHidden=false;
(function(){
  const tt=document.getElementById('taskToggle');
  const tk=document.getElementById('task');
  if(!tt||!tk) return;
  function apply(){
    if(window.__taskHidden){
      clearTimeout(window.__taskFadeT);
      tk.classList.add('hidden'); tk.classList.remove('faded');
      tt.textContent='Aufgabe einblenden';
    } else {
      tk.classList.remove('hidden','faded');
      tt.textContent='Aufgabe ausblenden';
      clearTimeout(window.__taskFadeT);
      window.__taskFadeT=setTimeout(()=>tk.classList.add('faded'),3500);
    }
  }
  tt.addEventListener('click',()=>{ window.__taskHidden=!window.__taskHidden; apply(); });
  tt.addEventListener('pointerenter',()=>{ if(!window.__taskHidden){ tk.classList.remove('faded'); } });
})();

boot();

})();
