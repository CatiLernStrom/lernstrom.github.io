/* ============ Verdrahten (Pin <-> Pin, Pin <-> Dot, Leitung) ============ */
function startWire(c,p,e){ wireStart={from:{c:c.id,p:p.id}, cur:toWorld(e)}; svg.setPointerCapture(e.pointerId); render();}
function endWire(c,p){
  if(wireStart){
    const from=wireStart.from, to={c:c.id,p:p.id};
    if(!sameEnd(from,to)){ const nw={id:nextId++, sheet:SHEET, a:from, b:to}; const col=wireColorFor(from,to); if(col) nw.color=col; wires.push(nw); }
  }
  wireStart=null; render(); simulate();
}
function sameEnd(a,b){ return JSON.stringify(a)===JSON.stringify(b); }
function startWireFromDot(d,e){ wireStart={from:{dot:d.id}, cur:toWorld(e)}; svg.setPointerCapture(e.pointerId); render(); }
function endWireOnDot(d){
  if(wireStart){ const from=wireStart.from, to={dot:d.id};
    if(!sameEnd(from,to)) wires.push({id:nextId++,sheet:SHEET,a:from,b:to}); }
  wireStart=null; render(); simulate();
}
// Klick auf bestehende Leitung -> bewussten Dot setzen und von dort starten
function startWireFromWire(w,pt){
  const t=closestTOnWire(w,pt);
  const d={id:nextId++, sheet:SHEET, onWire:w.id, t};
  dots.push(d);
  wireStart={from:{dot:d.id}, cur:pt};
  toast('Verbindungspunkt gesetzt — Ziel anklicken');
  render();
}
// Während Zeichnen auf andere Leitung treffen -> dort Dot + Draht
function finishWireOnWire(w,e){
  const pt=toWorld(e);
  const t=closestTOnWire(w,pt);
  const d={id:nextId++, sheet:SHEET, onWire:w.id, t};
  dots.push(d);
  if(wireStart && !sameEnd(wireStart.from,{dot:d.id})){
    wires.push({id:nextId++,sheet:SHEET,a:wireStart.from,b:{dot:d.id}});
  }
  wireStart=null; render(); simulate();
}
/* Treffer-Test beim Drag-Loslassen: nächste Klemme/Dot/Schiene am aktuellen
   Blatt innerhalb Toleranz finden. Liefert eine Endpunkt-Referenz oder null.
   So funktioniert das Verbinden auch per gezogenem Drag (nicht nur Klick-zu-Klick),
   unabhängig davon, dass render() die Pin-Elemente neu erzeugt. */
function hitTestEndpoint(pt, exclude){
  const TOL=16; let best=null, bd=TOL;
  // Pins der Bauteile auf diesem Blatt
  comps.filter(c=>(c.sheet||1)===SHEET).forEach(c=>{
    DEFS[c.kind].pins.forEach(p=>{
      const pos=rotPin(c,p); const d=Math.hypot(pos.x-pt.x,pos.y-pt.y);
      const ref={c:c.id,p:p.id};
      if(d<bd && !(exclude&&sameEnd(exclude,ref))){ bd=d; best=ref; }
    });
  });
  // Dots auf diesem Blatt
  dots.filter(d=>(d.sheet||1)===SHEET).forEach(d=>{
    const pos=dotPos(d); if(!pos)return; const dd=Math.hypot(pos.x-pt.x,pos.y-pt.y);
    const ref={dot:d.id};
    if(dd<bd && !(exclude&&sameEnd(exclude,ref))){ bd=dd; best=ref; }
  });
  // Schienen (warm/Rückleiter/PE) — Treffer wenn nahe an der Schienen-Y
  const rails = SHEET===1 ? [['L1',HS.L1],['L2',HS.L2],['L3',HS.L3],['N',HS.N],['PE',HS.PE]]
                          : [['L+',CS.Lplus],['N',CS.N]];
  rails.forEach(([name,yy])=>{
    if(pt.x<PATH_X0-4 || pt.x>PATH_X9+4) return;
    const dy=Math.abs(yy-pt.y);
    // BUG-FIX 1 — verteilter Andock-x (eigener Slot pro Leiter im Pfad).
    if(dy<bd){ bd=dy; best={rail:name, x:railSlotX(name, pt.x, exclude)}; }
  });
  return best;
}
// Draht beim Drag-Loslassen an der Zielposition abschliessen.
function finishWireAt(pt){
  if(!wireStart) return false;
  const to=hitTestEndpoint(pt, wireStart.from);
  if(to){
    if(!sameEnd(wireStart.from,to)){ const nw={id:nextId++,sheet:SHEET,a:wireStart.from,b:to}; const col=wireColorFor(wireStart.from,to); if(col) nw.color=col; wires.push(nw); }
    wireStart=null; render(); simulate(); return true;
  }
  return false; // kein Ziel getroffen -> wireStart bleibt aktiv (Klick-zu-Klick)
}
function removeWire(id){
  wires=wires.filter(w=>w.id!==id);
  dots=dots.filter(d=>d.onWire!==id);   // Dots auf gelöschter Leitung mitlöschen
  // Drähte, die an diesen Dots hingen, ebenfalls weg
  const goneDots=new Set(); dots.forEach(d=>{}); // (Dots schon gefiltert)
  wires=wires.filter(w=>!(w.a.dot!=null&&!dots.find(d=>d.id===w.a.dot)) && !(w.b.dot!=null&&!dots.find(d=>d.id===w.b.dot)));
  render();simulate();
}
function removeDot(id){
  dots=dots.filter(d=>d.id!==id);
  wires=wires.filter(w=>w.a.dot!==id && w.b.dot!==id);
  render();simulate();
}

/* ============ Pointer global ============ */
svg.addEventListener('pointermove',e=>{
  if(wpDrag){const pt=toWorld(e); const wp=wpDrag.w.waypoints[wpDrag.wi];
    wp.x=snap(pt.x); wp.y=snap(pt.y); render(); return;}
  if(drag){const pt=toWorld(e);const def=DEFS[drag.c.kind];
    // Bauteil-MITTE auf Pfad-Mittellinie snappen (nicht die obere-linke Ecke!)
    const centerX = snapX(pt.x - drag.dx + def.w/2);
    const nx = Math.round(centerX - def.w/2);
    const ny = snap(pt.y-drag.dy);
    if(nx!==drag.c.x||ny!==drag.c.y)drag.moved=true;
    drag.c.x=nx;drag.c.y=ny;render();}
  else if(wireStart){wireStart.cur=toWorld(e); wireStart.moved=true; render();}
});
svg.addEventListener('pointerup',e=>{
  if(wpDrag){wpDrag=null;simulate();}
  if(drag){drag=null;simulate();}
  if(wireStart){
    // Drag-Loslassen: nächste Klemme/Dot/Schiene treffen -> Draht abschliessen.
    const pt=toWorld(e);
    if(finishWireAt(pt)) return;
    // Nichts getroffen: war es ein echtes Ziehen, abbrechen; sonst armiert
    // lassen (Klick-zu-Klick: zweiter Klick auf Ziel-Klemme verbindet).
    if(wireStart.moved){ wireStart=null; render(); }
  }
});
let panning=null;
svg.addEventListener('pointerdown',e=>{
  if(e.target===svg || (e.target.tagName==='rect'&&!e.target.closest('g[transform]'))){
    if(MODE==='edit'){panning={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};}
  }
});
svg.addEventListener('pointermove',e=>{if(panning){view.x=panning.vx+(e.clientX-panning.x);view.y=panning.vy+(e.clientY-panning.y);render();}});
window.addEventListener('pointerup',()=>{panning=null;});
svg.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:1/1.1;const pt=toWorld(e);
  view.k=Math.min(2.4,Math.max(.4,view.k*f));
  const after=toWorld(e); view.x+=(after.x-pt.x)*view.k; view.y+=(after.y-pt.y)*view.k; render();},{passive:false});

function toWorld(e){const r=svg.getBoundingClientRect();return {x:(e.clientX-r.left-view.x)/view.k,y:(e.clientY-r.top-view.y)/view.k};}
function snap(v){return Math.round(v/10)*10;}
// X snappt auf Strompfade 0-9 (Mittellinie) wenn nahe, sonst 10er-Raster
function snapX(v){
  const px=nearestPathX(v);
  if(Math.abs(px-v) < (PATH_X9-PATH_X0)/10/2) return Math.round(px);
  return Math.round(v/10)*10;
}

/* ============ Bauteil hinzufügen ============ */
function addComp(kind,x,y){
  const def=DEFS[kind];
  const sheet=def.sheet||1;
  if(sheet!==SHEET){ switchSheet(sheet); }
  // auf Strompfad ausrichten: Bauteilmitte auf Pfad-Mittellinie
  const cx=snapX(x), cy=snap(y-def.h/2);
  const c={id:nextId++, kind, x:Math.round(cx-def.w/2), y:cy, sheet, rot:0};
  // FREIE BESCHRIFTUNG: Geräte-Bezeichnung (tag) startet LEER — der User
  // beschriftet selbst (Doppelklick / Klick im Bearbeiten-Modus aufs Label).
  // Spulen/Relais behalten einen funktionalen Namen (Q1/K1 …), weil Kontakte
  // per coilRef DARAUF verweisen (Simulation). Der Name bleibt frei änderbar.
  if(HAS_TAG.includes(kind)){ c.tag=''; }
  // Funktionale Defaults (Logik, kein freies Label):
  if(kind==='coil'){ c.name=nextName('Q'); }
  if(kind==='timer'){ c.name=nextName('K'); }
  if(kind==='relaisAllg'||kind==='relaisAnzug'||kind==='relaisRueck'||kind==='schrittrelais'){ c.name=nextName('K'); }
  if(kind==='mainK'){ c.coilRef='Q1'; }
  if(kind==='auxNO'||kind==='auxNC'){ c.coilRef='Q1'; }
  if(kind==='kAnzugNO'||kind==='kAnzugNC'){ c.coilRef='K3'; }
  if(kind==='kRueckNO'||kind==='kRueckNC'){ c.coilRef='K2'; }
  if(kind==='motor'){ c.starMode='stern'; }
  if(kind==='schmelz'){ c.rating='10A'; }
  if(kind==='lsschalter'){ c.rating='13A C'; }
  comps.push(c); render(); simulate(); return c;
}
// Fortlaufende Spulen-/Relais-Namen Q1,Q2 / K1,K2 (Sim-Referenz, frei änderbar).
// Geräte-Bezeichnungen (tag) werden NICHT mehr automatisch vergeben -> bleiben
// leer, der User beschriftet selbst (siehe editLabel).
function nextName(prefix){const used=comps.filter(c=>COIL_KINDS.includes(c.kind)).map(c=>c.name);for(let i=1;i<20;i++)if(!used.includes(prefix+i))return prefix+i;return prefix+'9';}

/* ============ Palette ============ */
function buildPalette(){
  const pal=document.getElementById('palette');
  const cats={};
  Object.entries(DEFS).forEach(([k,d])=>{(cats[d.cat]=cats[d.cat]||[]).push([k,d]);});
  let html='';
  // feste Reihenfolge der Kategorien; unbekannte hinten anfügen
  const order=['Hauptstrom','Steuerstrom','Befehlsgeräte','Relais','Sensorik','Meldung'];
  const catList=order.filter(c=>cats[c]).concat(Object.keys(cats).filter(c=>!order.includes(c)));

/* ============ SIMULATION KERN ============
   Knoten = verbundene Pin-/Dot-Mengen (Union-Find über Drähte UND die
   bewussten Verbindungspunkte). Kreuzende Leitungen ohne Dot teilen KEINEN
   Knoten — eine Verbindung entsteht nur über Klemmen (Pins), Pin-Dot-Drähte
   oder Dot-auf-Leitung (der Dot wird mit der Leitung verbunden).
   Quellen: Blatt1 L1/L2/L3 = L (warm). Blatt2/3 L+ = warm, N = Rückleiter.
   Spule erregt, wenn A1 warm UND A2 mit N verbunden. Iterativ (Selbsthaltung).
   ============================================================ */
function simulate(){
  if(MODE!=='run'){ SIM=null; render(); updatePanel(); return; }

  // alle Knoten-IDs sammeln (Pins + Dots)
  function freshUF(){
    const par={};
    const f=x=>{par[x]=par[x]||x;return par[x]===x?x:(par[x]=f(par[x]));};
    const u=(a,b)=>{par[f(a)]=f(b);};
    comps.forEach(c=>DEFS[c.kind].pins.forEach(p=>{par[c.id+'|'+p.id]=c.id+'|'+p.id;}));
    dots.forEach(d=>{ par['dot|'+d.id]='dot|'+d.id; });
    // Rail-Knoten anhand verwendeter Wire-Endpunkte registrieren
    wires.forEach(w=>{ [w.a,w.b].forEach(e=>{ if(e.rail!=null){const k=railKey(e,w.sheet);par[k]=par[k]||k;} }); });
    return {f,u};
  }
  function endKey(ref,sheet){ return ref.rail!=null ? railKey(ref,sheet) : (ref.dot!=null ? 'dot|'+ref.dot : ref.c+'|'+ref.p); }
  function applyWiresAndDots(u,f){
    wires.forEach(w=>u(endKey(w.a,w.sheet),endKey(w.b,w.sheet)));
    // Dot auf Leitung: Dot teilt Knoten mit beiden Enden der Trägerleitung
    dots.forEach(d=>{ const w=wires.find(x=>x.id===d.onWire); if(w){ u('dot|'+d.id, endKey(w.a,w.sheet)); u('dot|'+d.id, endKey(w.b,w.sheet)); } });
  }

  function elementClosed(c,coils){
    switch(c.kind){
      case 'mss': return [['1','2'],['3','4'],['5','6']];
      case 'mainK': { const cl=contactorClosed(c,coils); return cl?[['1','2'],['3','4'],['5','6']]:[]; }
      case 'msr': { const tr=anyTrip(); return tr?[]:[['1','2'],['3','4'],['5','6']]; }
      case 'heater': return [['1','2']];
      case 'btnNO': return pressedC(c)?[['a','b']]:[];
      case 'btnNC': return pressedC(c)?[]:[['a','b']];
      case 'notaus': return pressedC(c)?[]:[['a','b']];          // Öffner, rastend
      case 'endschalter': { const act=pressedC(c); return (c.nc?!act:act)?[['a','b']]:[]; }
      case 'wahl': case 'thermostat': case 'waechter': case 'schwimmer':
        return sel(c)?[['a','b']]:[];                              // Umschalt-/Wahlkontakt: An = leitend
      case 'auxNO': return contactorClosed(c,coils)?[['a','b']]:[];
      case 'auxNC': return contactorClosed(c,coils)?[]:[['a','b']];
      case 'msrAux': return anyTrip()?[]:[['a','b']];
      /* ---- NEU: Steuerungstechnik-Symbolsatz ---- */
      // Taster
      case 'eintaster': case 'schluesseltaster': return pressedC(c)?[['3','4']]:[];   // Schliesser
      case 'austaster': return pressedC(c)?[]:[['1','2']];                            // Öffner
      case 'notausS21': return pressedC(c)?[]:[['1','2']];                            // Öffner, rastend
      // Niveau / Endschalter (Sensor sel(c) = aktiv)
      case 'niveauNC': return sel(c)?[]:[['1','2']];
      case 'niveauNO': return sel(c)?[['3','4']]:[];
      case 'endNO': return pressedC(c)?[['3','4']]:[];
      case 'endNC': return pressedC(c)?[]:[['1','2']];
      // Hand-0-Auto: Mitte(1) -> a (Hand) bei pos1 / -> b (Auto) bei pos2
      case 'handAuto': { const p=handPos(c); return p===1?[['1','a']]:p===2?[['1','b']]:[]; }
      // MSR-Kontakte F (Bimetall): Auslöse 95/96 Öffner, Alarm 97/98 Schliesser
      case 'fAusloese': return anyTrip()?[]:[['a','b']];
      case 'fAlarm': return anyTrip()?[['a','b']]:[];
      // Zeit-Kontakte (verzögert) — vereinfacht ohne Zeitbasis: folgen ihrer Spule
      case 'kAnzugNO': case 'kRueckNO': return contactorClosed(c,coils)?[['a','b']]:[];
      case 'kAnzugNC': case 'kRueckNC': return contactorClosed(c,coils)?[]:[['a','b']];
      // Steuergeräte mit eigener Speisung: leiten L->Kontakt bei sel(c)
      case 'schaltuhr': return sel(c)?[['1','2']]:[['1','3']];   // Umschalter
      case 'bewegungsmelder': return sel(c)?[['3','4']]:[];
      case 'daemmerung': return sel(c)?[['1','2']]:[];
      // Sicherungen: leiten immer durch (ausgelöst nicht modelliert)
      case 'schmelz': case 'lsschalter': return [['a','b']];
      // Meldeleuchten/Horn (neu): Strompfad durch, Anzeige separat
      case 'betriebsleuchte': case 'leuchtmelder': case 'alarmhorn': return [['a','b']];
      // Lasten/Leuchten/Horn leiten den Strompfad durch (Anzeige separat)
      case 'lampG': case 'lampR': case 'lampB': case 'horn': return [['a','b']];
      // Motor-Klemmbrett (3~): interne Wicklungen U1-U2, V1-V2, W1-W2 (immer),
      // plus Brücken je nach Schaltung. So bilden Stern und Dreieck im Union-Find
      // unterschiedliche Knoten ab (testbar + elektrisch sinnvoll).
      case 'motor': {
        const pairs=[['U1','U2'],['V1','V2'],['W1','W2']]; // Wicklungsstränge
        const mode=c.starMode||'stern';
        if(mode==='stern'){ pairs.push(['U2','V2'],['V2','W2']); }         // Sternpunkt W2-U2-V2
        else if(mode==='dreieck'){ pairs.push(['U1','W2'],['V1','U2'],['W1','V2']); } // Dreieck
        // mode==='keine': nur Wicklungen, keine Brücke
        return pairs;
      }
      default: return [];
    }
  }
  function pressedC(c){return !!toggleStates['btn_'+c.id];}
  function sel(c){return !!toggleStates['sel_'+c.id];}
  function anyTrip(){return comps.some(c=>['msr','msrAux','fAusloese','fAlarm'].includes(c.kind)&&toggleStates['trip_'+c.id]);}
  // TASK 4: ein Kontakt ist „erregt", wenn IRGENDEINE gleichnamige Spule (coilRef
  // == Spulen-Name) angezogen ist — blattübergreifend, Name = derselbe Apparat.
  function contactorClosed(c,coils){return coilEnergizedByName(c.coilRef,coils);}

  const isCoilKind=c=>COIL_KINDS.includes(c.kind);
  let coils={};
  if(SIM && SIM.coils){ comps.filter(isCoilKind).forEach(c=>{ coils[c.id]=!!SIM.coils[c.id]; }); }
  for(let iter=0;iter<14;iter++){
    const {f:f2,u:u2}=freshUF();
    applyWiresAndDots(u2,f2);
    comps.forEach(c=>{ elementClosed(c,coils).forEach(pair=>u2(c.id+'|'+pair[0], c.id+'|'+pair[1])); });

    const Lroots=new Set(), Nroots=new Set();
    // Quellen sind die festen Schienen — über unsichtbare „Schienen-Knoten":
    // jeder Pin, der auf der Schienen-Y / Pfad liegt, gilt automatisch nicht;
    // stattdessen modellieren wir Schienen als globale Quelle: alle Pins, die
    // mit einem supply-losen Schema arbeiten, werden über spezielle Klemmen
    // gespeist. Hier: nutze Schienenanschluss-Heuristik via Bauteiltyp.
    // -> Wir behandeln die obersten Hauptkontakt-/MSS-Eingänge etc. NICHT
    //    automatisch; die Speisung kommt über explizite Schienen-Pins:
    addRailSources(f2, Lroots, Nroots);

    const newCoils={};
    comps.filter(isCoilKind).forEach(c=>{
      const a1=f2(c.id+'|A1'), a2=f2(c.id+'|A2');
      // BUG 6: elektrisch erregt ODER von Hand betätigt (Test)
      newCoils[c.id]= (Lroots.has(a1) && Nroots.has(a2)) || !!toggleStates['man_'+(c.name||'K1')];
    });
    if(stable(coils,newCoils)){ coils=newCoils; break; }
    coils=newCoils;
  }

  // Finale Klassen
  const {f:f2,u:u2}=freshUF();
  applyWiresAndDots(u2,f2);
  comps.forEach(c=>{ elementClosed(c,coils).forEach(pair=>u2(c.id+'|'+pair[0], c.id+'|'+pair[1])); });
  const Lroots=new Set(), Nroots=new Set(), phaseRoots={};
  addRailSources(f2, Lroots, Nroots, phaseRoots);
  const hotPins=new Set();
  comps.forEach(c=>DEFS[c.kind].pins.forEach(p=>{const id=c.id+'|'+p.id;if(Lroots.has(f2(id)))hotPins.add(id);}));
  dots.forEach(d=>{ const id='dot|'+d.id; if(Lroots.has(f2(id)))hotPins.add(id); });

  // Motor läuft: U1/V1/W1 über geschlossene Hauptkontakte mit L verbunden
  let motor={run:false,dir:0,mode:'stern'};
  const mot=comps.find(c=>c.kind==='motor');
  if(mot){
    motor.mode = mot.starMode||'stern';
    // BUG-FIX (Phasen-Trennung): Ein 3~-Motor dreht nur, wenn seine Klemmen an
    // VERSCHIEDENEN Phasen liegen. Es genügt NICHT, drei Klemmen an dieselbe
    // Phase (z.B. 3x L1) zu hängen — das ergäbe kein Drehfeld. Daher zählen wir
    // die ANZAHL UNTERSCHIEDLICHER Phasen (L1/L2/L3), die den Motor speisen.
    const distinct=new Set();
    [['U1'],['V1'],['W1']].forEach(([t])=>{
      phasesOfRoot(f2(mot.id+'|'+t), phaseRoots).forEach(ph=>distinct.add(ph));
    });
    const phases=distinct.size;
    if(phases>=2 && !anyTrip()){
      motor.run=true;
      const k1=findCoilByName('Q1')||findCoilByName('K1');
      const k2=findCoilByName('Q2')||findCoilByName('K2');
      const k1on=k1&&coils[k1.id], k2on=k2&&coils[k2.id];
      motor.dir = k2on && !k1on ? -1 : 1;
    }
  }

  SIM={coils,hotPins,qClosed:true,motor,trip:anyTrip()};
  render(); updatePanel();
}

/* Schienen-Speisung: Pins die auf einer Schiene angeschlossen sind, werden
   warm/Rückleiter. Heuristik: Ein Pin gilt als an L-Schiene angeschlossen,
   wenn ein Draht ihn mit einem Punkt auf der Schienen-Y verbindet ODER er per
   Konvention ein oberster Einspeise-Pin ist. Wir vereinfachen praxisnah:
   - Blatt 1: die "oberen" Pins (1/3/5) eines MSS, der direkt unter den
     Schienen sitzt, gelten als L-gespeist; ebenso jede Klemme/jeder Dot der
     vertikal NAHE einer L-Schiene liegt und per Draht/Dot daran hängt.
   Damit Presets & freie Schaltungen funktionieren, speisen wir robust:
   jeden Endknoten, dessen Welt-Y nahe einer Schiene liegt UND der über die
   linke Speisespalte erreichbar ist, als Quelle. Einfacher & stabil:
   wir markieren Pins/Dots als Quelle, wenn ihre Welt-Y ~ Schiene und ihr
   Welt-X im Pfadbereich liegt. */
function addRailSources(f, Lroots, Nroots, phaseRoots){
  // Schienen sind die einzige Speisung. Eine Verbindung zur Schiene entsteht
  // nur durch eine bewusste Leitung auf die Schiene (rail-Endpunkt).
  // L-Schienen (warm): L1/L2/L3 (Blatt1), L+ (Blatt2/3).
  // N (Rückleiter): N auf den Steuer-Blättern.  PE ist Schutzleiter (keine
  // Funktion in der Logik). Wir registrieren alle vorkommenden Rail-Knoten:
  //
  // BUG-FIX (Phasen-Trennung): L1/L2/L3 sind DREI UNABHÄNGIGE Phasen-Netze.
  // `Lroots` bleibt die Sammel-Menge "an irgendeiner Phase = warm" (für Hot-
  // Färbung, Lampen, Spulen — das ist korrekt: jede Phase führt Spannung).
  // ZUSÄTZLICH füllen wir `phaseRoots` (optional): für jede Phase einen eigenen
  // Satz von Wurzel-Knoten. So kann z.B. der Motor prüfen, ob seine Klemmen an
  // VERSCHIEDENEN Phasen hängen — eine Verbindung an L1 zieht L2/L3 NICHT mit.
  wires.forEach(w=>{ [w.a,w.b].forEach(e=>{
    if(e.rail==null)return;
    const k=railKey(e,w.sheet);
    const root=f(k);
    if(e.rail==='L1'||e.rail==='L2'||e.rail==='L3'||e.rail==='L+'){
      Lroots.add(root);
      if(phaseRoots){ const ph=(e.rail==='L+'?'L1':e.rail); (phaseRoots[ph]=phaseRoots[ph]||new Set()).add(root); }
    }
    else if(e.rail==='N') Nroots.add(root);
    // PE: verbindbar (eigener Knoten via Union-Find), aber KEINE Quelle —
    // führt keine Spannung, speist nichts (Schutzleiter ohne Funktion in der Logik).
  });});
}
// Welche Phase(n) speist diesen (gewurzelten) Knoten? Liefert ein Set der
// Phasen-Namen ('L1'/'L2'/'L3'), die mit dem Knoten verbunden sind.
function phasesOfRoot(root, phaseRoots){
  const out=new Set();
  if(!phaseRoots) return out;
  ['L1','L2','L3'].forEach(ph=>{ if(phaseRoots[ph] && phaseRoots[ph].has(root)) out.add(ph); });
  return out;
}

function stable(a,b){const ka=Object.keys(a),kb=Object.keys(b);if(ka.length!==kb.length)return false;return kb.every(k=>a[k]===b[k]);}

  const k1on=s&&k1&&s.coils[k1.id], k2on=s&&k2&&s.coils[k2.id];
  document.getElementById('sK1').textContent=k1?(k1on?'erregt':'aus'):'—';
  document.getElementById('sK2').textContent=k2?(k2on?'erregt':'aus'):'—';

  document.getElementById('sMotor').textContent=m&&m.run?(m.dir>0?'Rechtslauf (R)':'Linkslauf (L)'):'Stillstand';
  document.getElementById('ledR').className='led'+(m&&m.run&&m.dir>0?' r':'');
  document.getElementById('ledL').className='led'+(m&&m.run&&m.dir<0?' l':'');
  const trip=s&&s.trip;
  document.getElementById('ledF').className='led'+(trip?' fault':'');
  document.getElementById('sF').textContent=trip?'AUSGELÖST':'ok';
  document.getElementById('ctxnote').textContent = MODE==='run'
    ? 'Einschalten-Modus: EIN/AUS-Taster klicken (halten = Tasten). MSR anklicken simuliert Überlast.'

}

/* ============ Presets ============ */
function loadPreset(which){
  comps=[];wires=[];dots=[];nextId=1;toggleStates={};
  if(MODE==='run')toggleMode();
  const C=(kind,sheet,x,y,extra)=>{const c={id:nextId++,kind,sheet,x,y,rot:0};
    if(kind==='mainK'||kind==='auxNO'||kind==='auxNC')c.coilRef='Q1';
    if(kind==='motor')c.starMode='stern';
    Object.assign(c,extra||{});comps.push(c);return c;};
  const wire=(a,pa,b,pb)=>wires.push({id:nextId++,sheet:a.sheet,a:{c:a.id,p:pa},b:{c:b.id,p:pb}});
  // Schienen-Anschluss: Pin -> Schiene (rail) am X des Pins
  const toRail=(c,p,rail)=>{ const pos=rotPin(c,DEFS[c.kind].pins.find(x=>x.id===p));
    wires.push({id:nextId++,sheet:c.sheet,a:{c:c.id,p:p},b:{rail:rail,x:Math.round(pos.x)}}); };

  if(which==='direkt'){
    // ---- Blatt 1 Hauptstrom ----
    const q=C('mss',1, pathX(1)-42, HS.L3+30);
    const k=C('mainK',1, pathX(1)-42, HS.L3+130, {coilRef:'Q1'});
    const f=C('msr',1, pathX(1)-42, HS.L3+250);
    const m=C('motor',1, pathX(1)-60, HS.L3+330, {starMode:'stern'});
    // Einspeisung: MSS-Eingänge auf Schienen
    toRail(q,'1','L1');toRail(q,'3','L2');toRail(q,'5','L3');
    wire(q,'2',k,'1');wire(q,'4',k,'3');wire(q,'6',k,'5');
    wire(k,'2',f,'2');wire(k,'4',f,'4');wire(k,'6',f,'6');
    wire(f,'1',m,'U1');wire(f,'3',m,'V1');wire(f,'5',m,'W1');
    // ---- Blatt 2 Steuerstrom ----
    const fa=C('msrAux',2, pathX(2)-24, CS.Lplus+30);
    const s0=C('btnNC',2, pathX(2)-24, CS.Lplus+120, {tag:'S1'});
    const s1=C('btnNO',2, pathX(2)-24, CS.Lplus+210, {tag:'S2'});
    const a13=C('auxNO',2, pathX(3)-24, CS.Lplus+210, {coilRef:'Q1'});
    const c1=C('coil',2, pathX(2)-24, CS.Lplus+310, {name:'Q1'});
    toRail(fa,'a','L+'); toRail(c1,'A2','N');
    wire(fa,'b',s0,'a');
    wire(s0,'b',s1,'a');
    wire(s0,'b',a13,'a');
    wire(a13,'b',s1,'b');
    wire(s1,'b',c1,'A1');
    SCHEMA_NAME='Direktstart (IKS)';
    toast('Direktstart geladen — Blatt 2: „Einschalten", dann EIN-Taster S2 drücken');
  } else if(which==='wende'){
    // ---- Blatt 1 ----
    const q=C('mss',1, pathX(1)-42, HS.L3+30);
    const k1=C('mainK',1, pathX(1)-42, HS.L3+130, {coilRef:'Q1'});
    const k2=C('mainK',1, pathX(3)-42, HS.L3+130, {coilRef:'Q2'});
    const f=C('msr',1, pathX(2)-42, HS.L3+250);
    const m=C('motor',1, pathX(2)-60, HS.L3+330, {starMode:'stern'});
    toRail(q,'1','L1');toRail(q,'3','L2');toRail(q,'5','L3');
    wire(q,'2',k1,'1');wire(q,'4',k1,'3');wire(q,'6',k1,'5');
    wire(q,'2',k2,'1');wire(q,'4',k2,'3');wire(q,'6',k2,'5');
    wire(k1,'2',f,'2');wire(k1,'4',f,'4');wire(k1,'6',f,'6');
    wire(k2,'2',f,'2');wire(k2,'4',f,'6');wire(k2,'6',f,'4'); // Phasentausch L2/L3
    wire(f,'1',m,'U1');wire(f,'3',m,'V1');wire(f,'5',m,'W1');
    // ---- Blatt 2 ----
    const fa=C('msrAux',2, pathX(2)-24, CS.Lplus+24);
    const s0=C('btnNC',2, pathX(2)-24, CS.Lplus+104, {tag:'S1'});
    const sR=C('btnNO',2, pathX(1)-24, CS.Lplus+200, {tag:'S2'});
    const lk2a=C('auxNC',2, pathX(1)-24, CS.Lplus+280, {coilRef:'Q2'});
    const ah1=C('auxNO',2, pathX(0)-24, CS.Lplus+200, {coilRef:'Q1'});
    const c1=C('coil',2, pathX(1)-24, CS.Lplus+360, {name:'Q1'});
    const sL=C('btnNO',2, pathX(3)-24, CS.Lplus+200, {tag:'S3'});
    const lk1a=C('auxNC',2, pathX(3)-24, CS.Lplus+280, {coilRef:'Q1'});
    const ah2=C('auxNO',2, pathX(4)-24, CS.Lplus+200, {coilRef:'Q2'});
    const c2=C('coil',2, pathX(3)-24, CS.Lplus+360, {name:'Q2'});
    toRail(fa,'a','L+'); toRail(c1,'A2','N'); toRail(c2,'A2','N');
    wire(fa,'b',s0,'a');
    wire(s0,'b',sR,'a');
    wire(s0,'b',ah1,'a'); wire(ah1,'b',sR,'b');
    wire(sR,'b',lk2a,'a'); wire(lk2a,'b',c1,'A1');
    wire(s0,'b',sL,'a');
    wire(s0,'b',ah2,'a'); wire(ah2,'b',sL,'b');
    wire(sL,'b',lk1a,'a'); wire(lk1a,'b',c2,'A1');
    SCHEMA_NAME='Wendeschützsteuerung';
    toast('Wendeschütz geladen — S2=Rechts (Q1), S3=Links (Q2), S1=Aus, verriegelt');
  } else {
    // ---- Stern-Dreieck (vereinfacht, K1 Netz + Anzeige) ----
    const q=C('mss',1, pathX(1)-42, HS.L3+30);
    const k1=C('mainK',1, pathX(1)-42, HS.L3+130, {coilRef:'Q1'}); // Netzschütz
    const f=C('msr',1, pathX(1)-42, HS.L3+250);
    const m=C('motor',1, pathX(1)-60, HS.L3+330, {starMode:'stern'});
    toRail(q,'1','L1');toRail(q,'3','L2');toRail(q,'5','L3');
    wire(q,'2',k1,'1');wire(q,'4',k1,'3');wire(q,'6',k1,'5');
    wire(k1,'2',f,'2');wire(k1,'4',f,'4');wire(k1,'6',f,'6');
    wire(f,'1',m,'U1');wire(f,'3',m,'V1');wire(f,'5',m,'W1');
    // ---- Blatt 2 ----
    const fa=C('msrAux',2, pathX(2)-24, CS.Lplus+30);
    const s0=C('btnNC',2, pathX(2)-24, CS.Lplus+120, {tag:'S1'});
    const s1=C('btnNO',2, pathX(2)-24, CS.Lplus+210, {tag:'S2'});
    const a13=C('auxNO',2, pathX(3)-24, CS.Lplus+210, {coilRef:'Q1'});
    const c1=C('coil',2, pathX(2)-24, CS.Lplus+310, {name:'Q1'});
    toRail(fa,'a','L+'); toRail(c1,'A2','N');
    wire(fa,'b',s0,'a');
    wire(s0,'b',s1,'a');
    wire(s0,'b',a13,'a'); wire(a13,'b',s1,'b');
    wire(s1,'b',c1,'A1');
    SCHEMA_NAME='Stern-Dreieck-Anlauf';
    toast('Stern-Dreieck (Basis) — Motor auf Stern; im Bauteil-Menü Dreieck wählbar');
  }
  SHEET=1; buildSheetbar(); render();simulate();
}

/* ============ Drucken (A4 Querformat, alle 3 Blätter) ============ */
function printSchema(){
  const area=document.getElementById('printArea'); if(!area) { window.print(); return; }
  const wasRun = MODE==='run'; if(wasRun) toggleMode();   // im Bearbeiten-Modus drucken (saubere Symbole)
  const savedSheet=SHEET, savedView={x:view.x,y:view.y,k:view.k};
  area.innerHTML='';
  [1,2,3].forEach(n=>{
    SHEET=n; render();
    const block=document.createElement('div');
    block.style.cssText='page-break-after:always;width:100%';
    const clone=svg.cloneNode(true);
    clone.removeAttribute('style');
    clone.setAttribute('viewBox','0 0 '+SHEET_W+' '+SHEET_H);
    // Render-Transform der Hauptgruppe neutralisieren (volles Blatt anzeigen)
    const g=clone.querySelector('g'); if(g) g.setAttribute('transform','translate(0,0) scale(1)');
    clone.setAttribute('width','100%'); clone.removeAttribute('height');
    block.appendChild(clone); area.appendChild(block);
  });
  SHEET=savedSheet; view.x=savedView.x;view.y=savedView.y;view.k=savedView.k; render();
  const cleanup=()=>{ area.innerHTML=''; window.removeEventListener('afterprint',cleanup); };
  window.addEventListener('afterprint',cleanup);
  window.print();
}

/* ============ Toggles (einklappen) ============ */
function togglePalette(){ document.getElementById('palette').classList.toggle('collapsed'); }
function togglePanel(){
  const p=document.getElementById('simPanel'); p.classList.toggle('collapsed');
  document.getElementById('btnPanel').textContent = p.classList.contains('collapsed') ? '+' : '–';
}
function toggleTheme(){
  THEME = THEME==='light' ? 'dark' : 'light';
  applyTheme();
  try{ localStorage.setItem('lernstrom_motor_theme', THEME); }catch(e){}
}
function applyTheme(){
  applyThemeColors();
  document.body.classList.toggle('light', THEME==='light');
  const b=document.getElementById('btnTheme');
  if(b) b.lastChild.textContent = THEME==='light' ? ' Hell' : ' Dunkel';
  buildPalette(); render();
}

/* ============ Init ============ */
try{ const st=localStorage.getItem('lernstrom_motor_theme'); if(st) THEME=st; }catch(e){}
applyThemeColors();
document.body.classList.toggle('light', THEME==='light');
buildPalette();
buildSheetbar();
// Ansicht so setzen, dass Blatt zentriert sichtbar ist
(function fit(){
  const r=svg.getBoundingClientRect();
  if(r.width&&r.height){ view.k=Math.min(r.width/(SHEET_W+40), r.height/(SHEET_H+40), 1.1);
    view.x=(r.width-SHEET_W*view.k)/2; view.y=(r.height-SHEET_H*view.k)/2; }
})();
(function(){ const b=document.getElementById('btnTheme'); if(b) b.lastChild.textContent = THEME==='light' ? ' Hell' : ' Dunkel'; })();
render();
</script>
